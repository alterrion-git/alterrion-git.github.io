# Builds the CWA Health Android companion (android/) and publishes the APK.
#   - every push that touches android/: build + unit tests, APK as a workflow artifact
#   - on main: also the "android-latest" release, so the newest APK is always at
#     https://github.com/alterrion-git/alterrion-git.github.io/releases/download/android-latest/cwa-health.apk
#
# Signing: add repository secrets ANDROID_KEYSTORE_B64 (base64 of a .jks with key alias "cwa")
# and ANDROID_KEYSTORE_PASSWORD. Without them each build is signed with a throwaway key, and
# installing a newer build needs an uninstall first.
name: Android app

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cwa.jks"
            echo "CWA_KEYSTORE=$RUNNER_TEMP/cwa.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret: this APK is signed with a throwaway key (uninstall before installing a newer build)."
          fi

      - name: Test and build
        working-directory: android
        env:
          CWA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cwa-health-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish android-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk cwa-health.apk
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "CWA Health (Android)" --notes "Companion app for CWA: Health Connect data and Xiaomi scale weigh-ins. Install cwa-health.apk on your phone." --latest=false
          gh release upload android-latest cwa-health.apk --clobber
          gh release edit android-latest --title "CWA Health (Android) · build ${{ github.run_number }}"
