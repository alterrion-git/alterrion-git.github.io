    <!-- The app is dark already: without this, browsers' automatic dark mode for web pages
         (Chrome "Dark theme for sites", Samsung Internet dark mode, Android's forced dark)
         "darkens" it and the lime buttons and active tabs turn into dark blanks. -->

    <meta name="screen-orientation" content="portrait">

         Loading them from Google Fonts meant a slow/failed load showed icon names as raw
         text ("bar_chart") and swapped the app font for a differently-sized system font. -->

    <link rel="preload" href="fonts/barlow-latin-400.woff2" as="font" type="font/woff2" crossorigin>

        /* Icon subset built by tools/build-icons.py; icons are addressed by codepoint (ICON_CP). */
        @font-face {
            font-family: 'Material Symbols Outlined';
            font-style: normal;
            font-weight: 100 700;
            font-display: block;
            src: url(fonts/material-symbols.woff2) format('woff2');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html {
            /* Stop Android/iOS from "boosting" text sizes per block, which made font
               sizes differ between screens and between visits. */
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        :root {
            color-scheme: dark; /* see the color-scheme meta tag */
            --void: #0b0e11;
            --surface: #0b0e11;
            --surface-container-lowest: #000000;
            --surface-container-low: #101417;
            --surface-container: #161a1e;
            --surface-container-high: #1c2024;
            --surface-container-highest: #22262b;
            --surface-bright: #282d31;
            --surface-variant: #22262b;
            --primary: #f4ffc6;
            --primary-container: #d1fc00;
            --primary-dim: #c7ef00;
            --primary-fixed: #d1fc00;
            --primary-fixed-dim: #c4ec00;
            --on-primary: #546600;
            --on-primary-container: #4c5d00;
            --on-surface: #f8f9fe;
            --on-surface-variant: #a9abaf;
            --on-background: #f8f9fe;
            --outline: #737679;
            --outline-variant: #45484c;
            --secondary: #efe754;
            --warn: #ffb547;
            --secondary-container: #656100;
            --on-secondary-container: #fffac3;
            --tertiary: #ffeb9c;
            --error: #ff7351;
            --error-container: #b92902;
            --on-error-container: #ffd2c8;
            /* Nutrition: macro colours (rings, bars, timeline) */
            --macro-p: #ff7a6b;
            --macro-c: #ffb547;
            --macro-f: #5cb8ff;
            --macro-fib: #7ed69a;
            --macro-sug: #ff8fc8;
            --macro-salt: #b9c2cc;
        }
        /* Display type: anything in font-black (screen titles, big numbers, primary
           buttons) uses the condensed cut — the "refined" look from design option A. */
        .font-black, .font-display { font-family: 'Barlow Condensed', 'Barlow', sans-serif; font-weight: 800; letter-spacing: 0.01em; font-size-adjust: none; }
        input::placeholder, textarea::placeholder { color: var(--outline); opacity: 1; }
        @keyframes cwa-spin { to { transform: rotate(360deg); } }
        .cwa-spin { animation: cwa-spin 0.9s linear infinite; }

        body {
            font-family: 'Barlow', -apple-system, BlinkMacSystemFont, sans-serif;
            /* Barlow's lowercase is ~7% smaller than Inter's; match Inter's x-height so text
               reads at the same size as before the font switch. */
            font-size-adjust: 0.546;
            background: var(--void);
            color: var(--on-surface);
            overflow-x: hidden;
            overflow-y: auto;
            position: fixed;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            font-size: 22px;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            touch-action: manipulation;
        }
        
        #root {
            height: 100%;
            overflow-y: auto;
        }
        
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Scroll wheel modal */
        .scroll-wheel-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        
        .scroll-wheel-container {
            background: var(--surface-container-high);
            border-radius: 20px;
            padding: 20px;
            width: 300px;
            text-align: center;
        }
        
        .scroll-wheel {
            height: 200px;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
        }
        
        .scroll-wheel-item {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            scroll-snap-align: center;
            cursor: pointer;
            color: var(--on-surface-variant);
        }
        
        .scroll-wheel-item.active {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary-container);
        }

        /* Some browsers (Samsung Internet) look for a dark theme of the site's own before they
           force their dark mode on it; this is that signal (the app only has its dark theme). */
        @media (prefers-color-scheme: dark) {
            :root { color-scheme: dark; }
        }

        /* Kinetic gradient for primary CTAs */
        .kinetic-gradient {
            background: linear-gradient(45deg, #d1fc00, #c4ec00);
        }

        /* Ghost border utility */
        .ghost-border {
            border: 1px solid rgba(69, 72, 76, 0.15);
        }

<body>
    <div id="root"></div>
    <!-- Food tab (diary, Open Food Facts, scanning, food photos). Must load before the main
         script below, which renders it; keep ?v= in sync with APP_VERSION. -->
    <script src="js/nutrition.js?v=3.27.2"></script>
    <script src="js/coach.js?v=3.27.2"></script>
    <script src="js/health.js?v=3.27.2"></script>
    <script src="js/weight.js?v=3.27.2"></script>
    <script src="js/watch.js?v=3.27.2"></script>
    <script>
        // Register service worker for PWA
        const APP_VERSION = '3.27.2';
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register(`sw.js?v=${APP_VERSION}`).catch(() => {
                    console.log('Service worker registration failed');
                });
            });
        }
        
        window.addEventListener('load', () => {
            setTimeout(() => { window.scrollTo(0, 1); }, 100);
        });

        // The React layout reacts to most viewport changes in place (see useViewport) — URL
        // bar, keyboard, rotation, lock/unlock all re-layout without a reload.
        // BUT a true fold/unfold (cover screen <-> main screen) swaps the whole display, and
        // some browsers keep a stale layout viewport across that transition, leaving the app
        // visibly clipped on the right/bottom. For that ONE case we do a debounced reload.
        // It's safe now: the in-progress workout and view are persisted and auto-resume, so a
        // reload lands the user right back where they were instead of "closing" the app.
        let __lastW = window.innerWidth, __lastH = window.innerHeight;
        const __coverOf = (w, h) => h < w * 1.2; // cover screen = short relative to width
        const onBigResize = () => {
            const w = window.innerWidth, h = window.innerHeight;
            // The decisive fold signal is the cover<->main classification flipping. A huge
            // single-dimension jump is a fallback. Keyboard/URL-bar height changes are smaller
            // and don't flip the classification on a normal main screen, so they won't reload.
            const flipped = __coverOf(__lastW, __lastH) !== __coverOf(w, h);
            const huge = Math.abs(w - __lastW) > 300 || Math.abs(h - __lastH) > 500;
            __lastW = w; __lastH = h;
            if (flipped || huge) window.location.reload();
        };
        let __rzT;
        window.addEventListener('resize', () => { clearTimeout(__rzT); __rzT = setTimeout(onBigResize, 250); });
        window.addEventListener('orientationchange', () => setTimeout(onBigResize, 200));
        if (window.screen && window.screen.orientation) {
            window.screen.orientation.addEventListener('change', () => setTimeout(onBigResize, 200));
        }

        // ============================================
        // FIREBASE CLOUD SYNC
        // ============================================
        // Paste your Firebase Realtime Database URL below before uploading.
        // Get it from: Firebase Console > Realtime Database > URL at the top.
        const FIREBASE_DB_URL = 'https://workout-app-423a6-default-rtdb.europe-west1.firebasedatabase.app'; // e.g. 'https://your-project-default-rtdb.europe-west1.firebasedatabase.app'

        const cloudEnabled = () => FIREBASE_DB_URL.length > 0;

        // ============================================
        // AI RECAP PROXY (Gemini via a Cloudflare Worker)
        // ============================================
        // Recaps call this proxy instead of a model directly, so the Gemini API key stays
        // server-side (never in this public client). Deploy the worker in proxy/worker.js,
        // then paste its URL here. While empty, AI recaps are shown as "not configured".
        const LLM_PROXY_URL = 'https://crimson-waterfall-9438.blackrivercz.workers.dev';
        const proxyEnabled = () => LLM_PROXY_URL.length > 0;

        // Ask the AI proxy. body = { system, prompt } (one-shot) or
        // { system, messages:[{role,content}], user } (chat). Returns the text, or with
        // full = true { text, model } (model = which Workers AI model answered).
        async function callAIProxy(body, full) {
            const res = await fetch(LLM_PROXY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            let data = {};
            try { data = await res.json(); } catch (err) {}
            if (!res.ok) throw new Error((data && data.error) || `AI service error (${res.status})`);
            if (!data.text) throw new Error('The response came back empty — try again.');
            return full ? { text: data.text, model: data.model || '', fallback: data.fallback || '' } : data.text;
        }

        // The coach's prompt and its view of the user's data live in js/coach.js (window.CWACoach).

        // Coach conversations: the newest COACH_MAX_CHATS are kept; the coach sees the open one only.
        const COACH_MAX_CHATS = 5;
        const COACH_MAX_MESSAGES = 60;   // stored per conversation
        const COACH_CONTEXT_MESSAGES = 12; // sent to the model (the latest turns)
        const chatTitle = (text) => { const t = String(text || '').replace(/\s+/g, ' ').trim(); return t.length > 48 ? t.slice(0, 46).trim() + '…' : (t || 'Chat'); };
        // The old single never-ending chat → one conversation per day, newest first.
        function chatsFromLegacy(msgs) {
            const byDay = [];
            (msgs || []).filter(m => m && m.content).forEach(m => {
                const k = dayKey(m.ts || 0);
                if (!byDay.length || byDay[byDay.length - 1].k !== k) byDay.push({ k, messages: [] });
                byDay[byDay.length - 1].messages.push(m);
            });
            return byDay.reverse().slice(0, COACH_MAX_CHATS).map(g => {
                const first = g.messages[0], firstUser = g.messages.find(m => m.role === 'user') || first;
                return { id: 'c' + (first.ts || 0).toString(36), title: chatTitle(firstUser.content), created: first.ts || 0, updated: g.messages[g.messages.length - 1].ts || 0, messages: g.messages.slice(-COACH_MAX_MESSAGES) };
            });
        }

        const DAILY_AI_LIMIT = 10;

        // ============================================
        // FIREBASE AUTH (optional, secure mode) — OFF until you paste a Web API key.
        // ============================================
        // To turn the app into a properly secured multi-user app for free:
        //   1. Firebase console > Project settings > General > "Web API Key" -> paste below.
        //   2. Authentication > Sign-in method > enable "Email/Password".
        //   3. Realtime Database > Rules > paste the rules shown in Settings (in-app),
        //      which restrict each user to users/<their-uid>.
        // While this is empty, the app keeps the original username login unchanged.
        // Firebase Web API key: not kept in the code. The deploy workflow (.github/workflows/pages.yml)
        // puts the FIREBASE_API_KEY repository secret in place of the placeholder; the published page
        // still contains it (browsers need it — security comes from the database rules).
        const FIREBASE_API_KEY_RAW = '__FIREBASE_API_KEY__';
        const FIREBASE_API_KEY = FIREBASE_API_KEY_RAW.startsWith('__') ? '' : FIREBASE_API_KEY_RAW; // not injected (local copy) → no sign-in
        // Derive auth domain / project id from the DB URL's project ('workout-app-423a6').
        const FIREBASE_PROJECT_ID = (FIREBASE_DB_URL.match(/https:\/\/([^.]+)/) || [])[1] || '';
        const FIREBASE_CONFIG = {
            apiKey: FIREBASE_API_KEY,
            authDomain: FIREBASE_PROJECT_ID ? `${FIREBASE_PROJECT_ID.replace(/-default-rtdb$/, '')}.firebaseapp.com` : '',
            projectId: FIREBASE_PROJECT_ID.replace(/-default-rtdb$/, ''),
            databaseURL: FIREBASE_DB_URL,
        };
        // Secure mode is on only when a key is set AND the Firebase Auth SDK actually loaded.
        const fbSdkPresent = () => typeof firebase !== 'undefined' && firebase.auth;
        const fbAuthEnabled = () => FIREBASE_API_KEY.length > 0 && FIREBASE_DB_URL.length > 0 && fbSdkPresent();

        let __fbAuth = null;
        function fbInit() {
            if (__fbAuth) return __fbAuth;
            if (!fbSdkPresent()) return null;
            try {
                if (!(firebase.apps && firebase.apps.length)) firebase.initializeApp(FIREBASE_CONFIG);
                __fbAuth = firebase.auth();
                try { __fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); } catch (e) {}
                return __fbAuth;
            } catch (e) { return null; }
        }
        function fbMapError(err) {
            const c = (err && err.code) || '';
            const map = {

        // The user record minus old food-diary days. The food log grows every day, so instead

        // fields are read in parallel and the log only for the last FOOD_LOG_RECENT_DAYS.
        // Older days come from this device's copy or loadFoodRange (calendar / date browsing).
        const USER_FIELDS = ['email', 'createdAt', 'passwordHash', 'workouts', 'history', 'profile', 'metrics', 'recaps', 'chat', 'chats', 'coachMemory', 'aiUsage', 'foods', 'scaleSkips'];
        const FOOD_LOG_RECENT_DAYS = 62;

            const since = dayKey(Date.now() - FOOD_LOG_RECENT_DAYS * DAY_MS);
            const res = await Promise.all([
                ...USER_FIELDS.map(f => cloudRead(base + '/' + f, ms, '', a)),
                cloudRead(base + '/foodLog', ms, foodRangeParams(since), a),
                cloudRead(base + '/health', ms, foodRangeParams(since), a), // from the Android companion

        // --- Date helpers for weekly/monthly grouping & gating ---

        const AUTO_END_MS = 4 * 60 * 60 * 1000; // 4 hours

        // Downscale an uploaded image to a reasonable max dimension and JPEG-compress it,

        function compressImage(file, maxDim = 1024, quality = 0.8) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => {
                    let { width, height } = img;
                    if (width > height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
                    else if (height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }

        function getViewport() {

        // --- Workout Score Gauge (redesigned colors) ---
        function WorkoutScoreGauge({ score, maxScore }) {
            const scoreLevel = Math.round((score / maxScore) * 5);
            const clampedScore = Math.max(1, Math.min(5, scoreLevel));
            const percentage = clampedScore / 5;
            const fillAngle = 180 * percentage;
            
            const colors = [
                '#45484c', // outline-variant - 1/5
                '#737679', // outline - 2/5
                '#a9abaf', // on-surface-variant - 3/5
                '#c4ec00', // primary-fixed-dim - 4/5
                '#d1fc00'  // primary-container - 5/5
            ];
            
            return e('div', { className: 'flex flex-col items-center' },
                e('div', { className: 'text-sm mb-2', style: { color: 'var(--on-surface-variant)' } }, 'Workout Score'),
                e('div', { className: 'relative' },
                    e('svg', { width: 120, height: 70, viewBox: '0 0 120 70' },
                        e('defs', {},
                            e('linearGradient', { id: 'arcGradient', gradientUnits: 'userSpaceOnUse', x1: '10', y1: '60', x2: '110', y2: '60' },
                                e('stop', { offset: '0%', style: { stopColor: '#45484c', stopOpacity: 1 } }),
                                e('stop', { offset: '25%', style: { stopColor: '#737679', stopOpacity: 1 } }),
                                e('stop', { offset: '50%', style: { stopColor: '#a9abaf', stopOpacity: 1 } }),
                                e('stop', { offset: '75%', style: { stopColor: '#c4ec00', stopOpacity: 1 } }),
                                e('stop', { offset: '100%', style: { stopColor: '#d1fc00', stopOpacity: 1 } })
                            )
                        ),
                        (() => {
                            const startAngle = 180, endAngle = 360;
                            const startRad = (startAngle * Math.PI) / 180;
                            const endRad = (endAngle * Math.PI) / 180;
                            const radius = 50, cx = 60, cy = 60;
                            const x1 = cx + radius * Math.cos(startRad), y1 = cy + radius * Math.sin(startRad);
                            const x2 = cx + radius * Math.cos(endRad), y2 = cy + radius * Math.sin(endRad);
                            return e('path', { d: `M ${x1} ${y1} A ${radius} ${radius} 0 0 1 ${x2} ${y2}`, stroke: '#22262b', strokeWidth: 10, fill: 'none', strokeLinecap: 'round' });
                        })(),
                        (() => {
                            const startAngle = 180, endAngle = 180 + fillAngle;
                            const startRad = (startAngle * Math.PI) / 180;
                            const endRad = (endAngle * Math.PI) / 180;
                            const radius = 50, cx = 60, cy = 60;
                            const x1 = cx + radius * Math.cos(startRad), y1 = cy + radius * Math.sin(startRad);
                            const x2 = cx + radius * Math.cos(endRad), y2 = cy + radius * Math.sin(endRad);
                            const largeArcFlag = fillAngle > 180 ? 1 : 0;
                            return e('path', { d: `M ${x1} ${y1} A ${radius} ${radius} 0 ${largeArcFlag} 1 ${x2} ${y2}`, stroke: 'url(#arcGradient)', strokeWidth: 10, fill: 'none', strokeLinecap: 'round' });
                        })()
                    ),
                    e('div', { className: 'absolute bottom-0 left-1/2 transform -translate-x-1/2 text-center', style: { marginBottom: '-8px' } },
                        e('div', {
                            className: 'px-4 py-1 rounded-lg font-bold text-2xl',
                            style: { backgroundColor: colors[clampedScore - 1], color: clampedScore >= 4 ? 'var(--void)' : 'var(--on-surface)' }
                        }, `${clampedScore}/5`)
                    )
                )
            );
        }

        // --- Scroll Wheel ---
        function ScrollWheel({ value, onChange, onClose, label, step = 1, min = 0, max = 500 }) {
            const [items] = useState(() => {
                const arr = [];
                for (let i = min; i <= max; i += step) arr.push(i);
                return arr;
            });
            const wheelRef = useRef(null);
            const [selectedValue, setSelectedValue] = useState(value);

            useEffect(() => {
                if (wheelRef.current) {
                    const index = items.indexOf(value);
                    if (index !== -1) wheelRef.current.scrollTop = index * 50 - 75;
                }
            }, []);

            const handleScroll = () => {
                if (wheelRef.current) {
                    const scrollTop = wheelRef.current.scrollTop;
                    const index = Math.round((scrollTop + 75) / 50);
                    if (index >= 0 && index < items.length) setSelectedValue(items[index]);
                }
            };

            return e('div', { className: 'scroll-wheel-overlay', onClick: onClose },
                e('div', { className: 'scroll-wheel-container', onClick: (ev) => ev.stopPropagation() },
                    e('div', { className: 'text-xl mb-4' }, label),
                    e('div', { ref: wheelRef, className: 'scroll-wheel', onScroll: handleScroll },
                        e('div', { style: { height: '75px' } }),
                        items.map((item) =>
                            e('div', {
                                key: item,
                                className: `scroll-wheel-item ${item === selectedValue ? 'active' : ''}`,
                                onClick: () => { setSelectedValue(item); onChange(item); onClose(); }
                            }, step === 1 ? item : item.toFixed(1))
                        ),
                        e('div', { style: { height: '75px' } })
                    ),
                    e('div', { className: 'flex gap-4 mt-4' },
                        e('button', {
                            onClick: onClose,
                            className: 'flex-1 px-4 py-2 rounded-xl',
                            style: { background: 'var(--surface-container-highest)', color: 'var(--on-surface)' }
                        }, 'Cancel'),
                        e('button', {
                            onClick: () => { onChange(selectedValue); onClose(); },
                            className: 'flex-1 px-4 py-2 rounded-xl font-bold',
                            style: { background: 'linear-gradient(45deg, #d1fc00, #c4ec00)', color: 'var(--on-primary-container)' }
                        }, 'Set')
                    )
                )
            );
        }

        // --- Custom Number Input (rounded box design) ---
        // Format a number for display: drop trailing .0 but keep real decimals (partials).
        function fmtNum(v) {
            if (typeof v !== 'number' || isNaN(v)) return '0';
            return Number.isInteger(v) ? String(v) : String(Math.round(v * 100) / 100);
        }

        // Normalise a raw workout score (points / maxPoints, which varies with exercise count)
        // to a consistent whole number out of 10.
        function scoreOutOf10(score, maxScore) {
            if (!maxScore || maxScore <= 0) return 0;
            return Math.max(0, Math.min(10, Math.round((score / maxScore) * 10)));
        }

        function CustomNumberInput({ value, onChange, label, step = 1, size = 168 }) {
            const [isLongPress, setIsLongPress] = useState(false);
            const [tempValue, setTempValue] = useState('');
            const longPressTimer = useRef(null);

            // Scale all type sizes off the box size so it stays readable when shrunk.
            const valuePx = Math.round(size * 0.34);
            const arrowPx = Math.max(14, Math.round(size * 0.12));
            const sizePx = Math.round(size) + 'px';

            const handleTouchStart = () => { longPressTimer.current = setTimeout(() => { setIsLongPress(true); setTempValue(fmtNum(value)); }, 500); };
            const handleTouchEnd = () => { if (longPressTimer.current) clearTimeout(longPressTimer.current); };

            const handleBubbleClick = (ev) => {
                ev.stopPropagation();
                const rect = ev.currentTarget.getBoundingClientRect();
                const y = ev.clientY - rect.top;
                if (y < rect.height / 2) onChange(Math.round((value + step) * 100) / 100);
                else onChange(Math.max(0, Math.round((value - step) * 100) / 100));
            };

            const handleManualBlur = () => {
                const num = parseFloat(tempValue);
                if (!isNaN(num)) onChange(num);
                else if (tempValue === '') onChange(0);
                setIsLongPress(false);
            };

            if (isLongPress) {
                return e('div', { className: 'text-center' },
                    e('div', { className: 'font-bold uppercase tracking-widest mb-2', style: { color: 'var(--on-surface-variant)', fontSize: '0.8rem' } }, label),
                    e('input', {
                        type: 'number', step, value: tempValue, inputMode: 'decimal',
                        onChange: (ev) => setTempValue(ev.target.value),
                        onBlur: handleManualBlur,
                        onKeyDown: (ev) => { if (ev.key === 'Enter') ev.target.blur(); },
                        autoFocus: true,
                        className: 'font-black text-center rounded-2xl outline-none',
                        style: { width: sizePx, height: sizePx, fontSize: valuePx + 'px', background: 'var(--surface-container-high)', border: '3px solid var(--primary-container)', color: 'var(--on-surface)', caretColor: 'var(--primary-container)' }
                    })
                );
            }

            return e('div', { className: 'text-center' },
                e('div', { className: 'font-bold uppercase tracking-widest mb-2', style: { color: 'var(--on-surface-variant)', fontSize: '0.8rem' } }, label),
                e('div', {
                    onClick: handleBubbleClick,
                    onTouchStart: handleTouchStart, onTouchEnd: handleTouchEnd,
                    onMouseDown: handleTouchStart, onMouseUp: handleTouchEnd,
                    className: 'font-black text-center rounded-2xl outline-none flex flex-col items-center justify-center select-none cursor-pointer relative overflow-hidden',
                    style: { width: sizePx, height: sizePx, background: 'var(--surface-container-highest)', color: 'var(--on-surface)' }
                },
                    e('div', { className: 'absolute top-0 left-0 right-0 h-1/3 flex items-center justify-center', style: { paddingTop: '4px', fontSize: arrowPx + 'px', color: 'var(--primary-fixed-dim)', opacity: 0.6 } }, '\u25B2'),
                    e('div', { className: 'font-black', style: { fontSize: valuePx + 'px', lineHeight: 1 } }, fmtNum(value)),
                    e('div', { className: 'absolute bottom-0 left-0 right-0 h-1/3 flex items-center justify-center', style: { paddingBottom: '4px', fontSize: arrowPx + 'px', color: 'var(--primary-fixed-dim)', opacity: 0.6 } }, '\u25BC')
                )
            );
        }
