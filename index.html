                                        e(MIcon, { icon: 'play_arrow', fill: true, style: { fontSize: '22px', color: 'var(--primary-fixed-dim)' } })
                                    ))
                                )
                            ) : null
                        )
                    ),
                    e(BottomNavBar, { activeTab: 'workout', onTabChange: handleTabChange })
                );
            }

            // ======================
            // STATS VIEW
            // ======================
            if (view === 'food') {
                const N = window.CWANutrition;
                if (!N) {
                    return e('div', { className: 'min-h-screen flex flex-col', style: { background: 'var(--void)', color: 'var(--on-surface)' } },
                        e(TopAppBar, { title: 'FOOD', rightAction: profileBtn }),
                        e('div', { className: 'flex-1 pt-24 px-6 text-center' }, 'The Food module failed to load. Check your connection and reopen the app.'),
                        e(BottomNavBar, { activeTab: 'food', onTabChange: handleTabChange }));
                }
                return e(N.FoodScreen, { app: {
                    date: foodDate, setDate: setFoodDate, log: foodLog, saveDay: saveFoodDay,
                    foods, setFoods, profile, metrics,
                    setProfileFields: (vals) => setProfile(prev => ({ ...prev, ...vals })),
                    onTabChange: handleTabChange, profileBtn,
                    toast: setToast, toastText: toast,
                    confirm: setConfirmState,
                    confirmEl: confirmState ? e(ConfirmDialog, { ...confirmState, onCancel: () => setConfirmState(null) }) : null,
                    user: currentUser ? currentUser.username : '', aiEnabled: proxyEnabled(),
                } });
            }

            // ======================
            // HEALTH TAB (js/health.js: data from the CWA Health Android app)
            // ======================
            if (view === 'health') {
                return e('div', { className: 'min-h-screen flex flex-col', style: { background: 'var(--void)', color: 'var(--on-surface)' } },
                    e(TopAppBar, { title: 'HEALTH', rightAction: profileBtn }),
                    e('div', { className: 'flex-1 pt-20 pb-28 px-4 overflow-y-auto' },
                        e('div', { className: 'max-w-lg mx-auto' },
                            window.CWAHealth ? e(window.CWAHealth.HealthPanel, {
                                log: healthLog, metrics, profile, refreshing: healthLoading,
                                onLink: linkAndroidApp, onRefresh: () => refreshHealth(true),
                                onGoals: () => openProfile('goals'), onWeight: () => openProfile('weight'),
                            }) : e('div', null, 'Health module failed to load.'))),
                    confirmState ? e(ConfirmDialog, { ...confirmState, onCancel: () => setConfirmState(null) }) : null,
                    e(BottomNavBar, { activeTab: 'health', onTabChange: handleTabChange })
                );
            }

            if (view === 'stats') {
                // Compute stats from history
                const totalWorkouts = workoutHistory.length;
                const totalWeightKg = workoutHistory.reduce((sum, w) => {
                    return sum + w.exercises.reduce((eSum, ex) => {
                        return eSum + ex.sets.reduce((sSum, s) => sSum + s.reps * s.weight, 0);
                    }, 0);
                }, 0);
                const totalWeightTonnes = (totalWeightKg / 1000).toFixed(1);
                const totalSets = workoutHistory.reduce((sum, w) => {
                    return sum + w.exercises.reduce((eSum, ex) => eSum + ex.sets.length, 0);
                }, 0);
                const totalReps = Math.round(workoutHistory.reduce((sum, w) => {
                    return sum + w.exercises.reduce((eSum, ex) => eSum + ex.sets.reduce((sSum, s) => sSum + s.reps, 0), 0);
                }, 0) * 10) / 10;
                // Avg workout time (filter outliers: <40min or >90min)
                const validTimes = workoutHistory.map(w => w.totalTime).filter(t => t >= 2400 && t <= 5400);
                const avgTime = validTimes.length > 0 ? Math.round(validTimes.reduce((a, b) => a + b, 0) / validTimes.length) : 0;
                // Best single set weight
                let bestWeight = 0;
                let bestExName = '';
                workoutHistory.forEach(w => {
                    w.exercises.forEach(ex => {
                        ex.sets.forEach(s => {
                            if (s.weight > bestWeight) { bestWeight = s.weight; bestExName = ex.name; }
                        });
                    });
                });
                // Unique exercises
                const uniqueExercises = new Set();
                workoutHistory.forEach(w => w.exercises.forEach(ex => uniqueExercises.add(ex.name)));
                // Weekly frequency (last 4 weeks)
                const fourWeeksAgo = Date.now() - 28 * 24 * 60 * 60 * 1000;
                const recentWorkouts = workoutHistory.filter(w => w.date >= fourWeeksAgo);
                const weeklyAvg = recentWorkouts.length > 0 ? (recentWorkouts.length / 4).toFixed(1) : '0';

                // Last 10 workouts (newest first)
                const last10 = workoutHistory.slice().reverse().slice(0, 10);

                const statCard = (icon, value, label) => e('div', {
                    className: 'rounded-xl p-4 flex flex-col items-center',
                    style: { background: 'var(--surface-container-highest)' }
                },
                    e(MIcon, { icon, style: { fontSize: '22px', color: 'var(--primary-fixed-dim)', marginBottom: '6px' } }),
                    e('div', { className: 'text-xl font-black', style: { color: 'var(--on-surface)' } }, value),
                    e('div', { className: 'text-xs uppercase tracking-widest mt-1 text-center', style: { color: 'var(--on-surface-variant)' } }, label)
                );

                // Weekly rating: last 8 finished weeks + this week so far (CWANutrition.weekRating).
                const NR = window.CWANutrition;
                const weeklyCard = (() => {
                    if (!NR) return null;
                    const tg = NR.targetsFor(profile, metrics);
                    const planDays = DAYS.filter(d => workouts[d]);
                    const thisMon = NR.weekStartOf(Date.now());
                    const rate = (mon) => NR.weekRating({ mondayMs: mon, history: workoutHistory, planDays, log: foodLog, targets: tg, now: Date.now() });
                    const monOf = (k) => { const d = new Date(thisMon); d.setDate(d.getDate() - 7 * k); return d.getTime(); };
                    const past = [8, 7, 6, 5, 4, 3, 2, 1].map(k => rate(monOf(k)));
                    const current = rate(thisMon);
                    if (!past.some(r => r.score != null) && current.score == null) return null;
                    const last = past[past.length - 1];
                    const dm = (ms) => { const d = new Date(ms); return `${d.getDate()}.${d.getMonth() + 1}.`; };
                    const bar = (r, i, isCur) => e('button', {
                        key: i, onClick: () => r.score != null && setWeekInfo(r), 'aria-label': r.score != null ? `Week of ${dm(r.mondayMs)}: ${r.score.toFixed(1)} of 10` : `Week of ${dm(r.mondayMs)}: no data`,
                        className: 'flex-1 min-w-0 flex flex-col items-center justify-end gap-1 active:opacity-70', style: { height: 92 }
                    },
                        e('span', { className: 'text-[10px] font-bold', style: { color: 'var(--on-surface-variant)' } }, r.score != null ? (r.score >= 9.95 ? '10' : r.score.toFixed(1)) : ''),
                        e('div', { style: { width: '70%', maxWidth: 22, height: r.score != null ? Math.max(4, r.score * 5.6) : 4, borderRadius: 4, background: r.score != null ? (isCur ? 'transparent' : NR.ratingColor(r.score)) : 'var(--surface-container-highest)', border: isCur && r.score != null ? `2px dashed ${NR.ratingColor(r.score)}` : 'none', boxSizing: 'border-box' } }),
                        e('span', { className: 'text-[10px]', style: { color: isCur ? 'var(--primary-container)' : 'var(--outline)' } }, isCur ? 'now' : dm(r.mondayMs))
                    );
                    return e('div', { className: 'max-w-lg mx-auto mb-6' },
                        e('div', { className: 'text-xs uppercase tracking-widest mb-3 px-1', style: { color: 'var(--on-surface-variant)' } }, 'Weekly rating'),
                        e('div', { className: 'rounded-2xl p-4', style: { background: 'var(--surface-container-high)' } },
                            e('button', { onClick: () => last.score != null && setWeekInfo(last), className: 'w-full flex items-center gap-4 text-left active:opacity-80' },
                                e('div', { className: 'font-black leading-none', style: { fontSize: 46, color: NR.ratingColor(last.score) } }, last.score == null ? '—' : last.score.toFixed(1)),
                                e('div', { className: 'flex-1 min-w-0' },
                                    e('div', { className: 'text-sm font-bold' }, `Last week · ${dm(last.mondayMs)}–${dm(last.mondayMs + 6 * DAY_MS)}`),
                                    e('div', { className: 'text-xs', style: { color: 'var(--on-surface-variant)' } },
                                        [last.training ? `Training ${last.training.done}/${last.training.planned}` : null, last.nutrition ? `Food ${Math.round(last.nutrition.score * 100)} % (${last.nutrition.logged}/7 days)` : 'No food logged'].filter(Boolean).join(' · ')),

                                statCard('speed', totalReps, 'Total Reps'),

                            // Workout History
                            last10.length > 0 ? e('div', null,
                                e('div', { className: 'text-xs uppercase tracking-widest mb-3 px-1', style: { color: 'var(--on-surface-variant)' } }, 'Recent Workouts'),
                                e('div', { className: 'space-y-2' },
                                    last10.map((w, dispIdx) => {
                                        const realIdx = workoutHistory.length - 1 - dispIdx;
                                        const isExpanded = expandedHistoryIdx === realIdx;
                                        const wDate = new Date(w.date);
                                        const dateStr = wDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
                                        const totalWt = w.exercises.reduce((s, ex) => s + ex.sets.reduce((ss, set) => ss + set.reps * set.weight, 0), 0);
                                        const rating = w.totalTime >= 2400 && w.totalTime <= 5400 ? '\u2705' : (w.totalTime < 2400 ? '\u26A0\uFE0F' : '\u26A0\uFE0F');
                                        return e('div', { key: realIdx },
                                            // Main row (clickable)
                                            e('div', {
                                                className: 'rounded-xl p-3 flex items-center gap-3 cursor-pointer transition-all active:scale-[0.98]',
                                                style: { background: isExpanded ? 'var(--surface-container-highest)' : 'var(--surface-container-high)' },
                                                onClick: () => setExpandedHistoryIdx(isExpanded ? null : realIdx)
                                            },
                                                // Date badge
                                                e('div', {
                                                    className: 'w-12 text-center flex-shrink-0',
                                                },
                                                    e('div', { className: 'text-sm font-black leading-tight', style: { color: 'var(--primary-fixed-dim)' } }, dateStr.split(' ')[0]),
                                                    e('div', { className: 'text-xs uppercase', style: { color: 'var(--on-surface-variant)' } }, dateStr.split(' ')[1])
                                                ),
                                                // Name + day
                                                e('div', { className: 'flex-1 min-w-0' },
                                                    e('div', { className: 'font-bold text-sm truncate' }, w.name),
                                                    e('div', { className: 'text-xs', style: { color: 'var(--on-surface-variant)' } }, w.day)
                                                ),
                                                // Duration
                                                e('div', { className: 'text-sm font-bold flex-shrink-0', style: { color: 'var(--on-surface-variant)' } }, formatTime(w.totalTime)),
                                                // Score badge
                                                w.maxScore > 0 ? (() => {
                                                    const ratio = w.score / w.maxScore;
                                                    const level = Math.max(0, Math.min(4, Math.round(ratio * 5) - 1));
                                                    const colors = ['#45484c', '#737679', '#a9abaf', '#c4ec00', '#d1fc00'];
                                                    const bg = level >= 0 ? colors[Math.max(0, level)] : colors[0];
                                                    const fg = level >= 3 ? 'var(--void)' : 'var(--on-surface)';
                                                    return e('div', {
                                                        className: 'text-xs font-black px-1.5 py-0.5 rounded-lg flex-shrink-0',
                                                        style: { background: bg, color: fg, boxShadow: level >= 3 ? `0 0 8px ${bg}40` : 'none' }
                                                    }, `${scoreOutOf10(w.score, w.maxScore)}/10`);
                                                })() : null,
                                                // Expand arrow
                                                e(MIcon, { icon: isExpanded ? 'expand_less' : 'expand_more', style: { fontSize: '20px', color: 'var(--outline)' } })
                                            ),
                                            // Expanded detail
                                            isExpanded ? e('div', {
                                                className: 'rounded-b-xl px-4 py-3 -mt-1',
                                                style: { background: 'var(--surface-container-highest)' }
                                            },
                                                // Total weight
                                                e('div', { className: 'flex justify-between mb-3' },
                                                    e('span', { className: 'text-xs uppercase tracking-widest', style: { color: 'var(--on-surface-variant)' } }, 'Total Weight'),
                                                    e('span', { className: 'text-sm font-bold', style: { color: 'var(--primary-fixed-dim)' } }, `${totalWt.toFixed(0)} kg`)
                                                ),
                                                // Exercise list
                                                e('div', { className: 'space-y-1.5 mb-3' },
                                                    w.exercises.map((ex, ei) => {
                                                        const exWt = ex.sets.reduce((s, set) => s + set.reps * set.weight, 0);
                                                        const topSet = ex.sets.reduce((best, set) => set.weight > best.weight ? set : best, { reps: 0, weight: 0 });
                                                        return e('div', {
                                                            key: ei,
                                                            className: 'flex items-center justify-between px-2 py-1.5 rounded-lg',
                                                            style: { background: 'var(--surface-container-low)' }
                                                        },
                                                            e('span', { className: 'text-sm truncate flex-1' }, ex.name),
                                                            e('span', { className: 'text-xs flex-shrink-0 ml-2', style: { color: 'var(--on-surface-variant)' } },
                                                                `${ex.sets.length}×${fmtNum(topSet.reps)}@${fmtNum(topSet.weight)}kg`)
                                                        );
                                                    })
                                                ),
                                                // Delete button
                                                e('button', {
                                                    onClick: (ev) => {
                                                        ev.stopPropagation();
                                                        setConfirmState({
                                                            title: 'Delete from history?',
                                                            message: `This logged session of "${w.name}" (${dateStr}) will be permanently removed.`,
                                                            confirmLabel: 'Delete',
                                                            onConfirm: () => { deleteFromHistory(realIdx); setConfirmState(null); }
                                                        });
                                                    },
                                                    className: 'w-full py-2 rounded-lg text-sm font-bold transition-all active:scale-95',
                                                    style: { background: 'var(--surface-container-low)', color: 'var(--error)' }
                                                }, 'Delete from History')
                                            ) : null
                                        );
                                    })
                                )
                            ) : null
                        )
                    ),
                    confirmState ? e(ConfirmDialog, { ...confirmState, onCancel: () => setConfirmState(null) }) : null,
                    weekInfo && NR ? e(NR.WeekRatingDialog, { rating: weekInfo, onClose: () => setWeekInfo(null) }) : null,
                    e(BottomNavBar, { activeTab: 'progress', onTabChange: handleTabChange })
                );
            }

            // ======================
            // LIVE WORKOUT VIEW
            // ======================
            if (view === 'live') {
                const currentExercise = liveWorkout.exercises[currentExerciseIndex];
                const currentSet = currentExercise.sets[currentSetIndex];
                const nextExName = getNextExerciseName();
                const watchRestLeft = watchStatus === 'on' && window.CWAWatch ? window.CWAWatch.restLeft() : 0;

                // Size the reps/weight boxes to actually fit the current screen.
                // Cover layout packs [arrow][reps][weight][arrow] in one row, so the two
                // boxes must share the width left after the arrows; they are also capped by
                // the (short) available height. Full layout only shares width.
                // Cover row is [arrow][reps][weight][arrow]; reserve ~110px for the two compact
                // arrows + gaps + side padding, the rest is split between the two boxes (also
                // capped by the short height). Bigger than before to fill the empty space.
                // Cover height budget: ~216px of name/timers/labels/partials above and below
                // the boxes plus the ~64px nav pill, so on the Flip 7's ~400px-tall cover the
                // partials row stays clear of the nav.
                const boxSize = isCoverScreen
                    ? Math.max(96, Math.min(180, Math.floor((viewport.w - 112) / 2), Math.floor(viewport.h - 280)))
                    : Math.max(110, Math.min(168, Math.floor((viewport.w - 52) / 2)));
                const contentPadTop = 72;
                const contentPadBottom = isCoverScreen ? 56 : 112;

                // Partials control: 0.1-rep stepper (e.g. 8.3 = 8 reps + 3 partials). Replaces
                // the old manual "type 0.1 reps" hack. Rounded to 1 decimal to avoid float dust.
                const setReps = (v) => updateLiveSet('reps', Math.max(0, Math.round(v * 10) / 10));
                const partialFrac = Math.round((currentSet.reps - Math.floor(currentSet.reps)) * 10) / 10;
                const partialRow = e('div', { className: 'flex items-center justify-center gap-2 mt-2' },
                    e('button', {
                        onClick: () => setReps(currentSet.reps - 0.1),
                        className: 'w-9 h-9 rounded-full flex items-center justify-center text-lg font-black active:scale-90 flex-shrink-0',
                        style: { background: 'var(--surface-container-highest)', color: 'var(--on-surface)' }
                    }, '−'),
                    e('div', { className: 'px-3 py-1.5 rounded-full text-xs font-bold', style: { background: partialFrac ? 'var(--secondary-container)' : 'var(--surface-container-high)', color: partialFrac ? 'var(--on-secondary-container)' : 'var(--on-surface-variant)', minWidth: '104px', textAlign: 'center' } },
                        partialFrac ? `+${fmtNum(partialFrac)} partial` : 'Add 0.1 partial'),
                    e('button', {
                        onClick: () => setReps(currentSet.reps + 0.1),
                        className: 'w-9 h-9 rounded-full flex items-center justify-center text-lg font-black active:scale-90 flex-shrink-0',
                        style: { background: 'linear-gradient(45deg, #d1fc00, #c4ec00)', color: 'var(--void)' }
                    }, '+')
                );

                return e('div', {
                    className: 'h-full flex flex-col',
                    style: { background: 'var(--void)', color: 'var(--on-surface)', overflow: 'hidden' }
                },
                    // TopAppBar: CWA left, workout name center, sets left right
                    e(TopAppBar, {
                        title: liveWorkout.name.toUpperCase(),
                        // End/discard lives in the always-visible top bar (the bottom of a cover
                        // screen scrolls, so a bottom button could be hidden).
                        leftAction: e('button', {
                            onClick: () => setConfirmState({
                                title: 'Discard workout?',
                                message: 'Your progress for this session will be discarded and not saved to history.',
                                confirmLabel: 'Discard',
                                onConfirm: () => { cancelWorkout(); setConfirmState(null); }
                            }),
                            className: 'flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-bold transition-opacity active:opacity-70',
                            style: { background: 'var(--surface-container-high)', color: 'var(--on-surface-variant)' }
                        }, e(MIcon, { icon: 'close', style: { fontSize: '16px' } }), 'End'),
                        rightAction: e('div', { className: 'flex items-center gap-2' },
                            e('span', { className: 'text-xs uppercase tracking-widest', style: { color: 'var(--on-surface-variant)' } }, 'Sets'),
                            e('span', { className: 'text-lg font-black', style: { color: 'var(--on-surface)' } }, getTotalSetsRemaining())
                        )
                    }),
                    // Main content
                    e('div', { className: 'flex-1 flex flex-col px-4', style: { paddingTop: contentPadTop, paddingBottom: contentPadBottom, minHeight: 0, overflowY: 'auto' } },
                        // Exercise name row with progress dots
                        e('div', { className: 'flex items-center justify-between px-2 mb-1' },
                            e('div', { className: 'flex-1' },
                                e('div', { className: (isCoverScreen ? 'text-xl' : 'text-2xl') + ' font-black leading-tight' }, currentExercise.name,
                                    isCoverScreen ? e('span', { className: 'text-sm font-bold ml-2', style: { color: 'var(--on-surface-variant)', fontFamily: 'Barlow, sans-serif' } }, `Set ${currentSetIndex + 1}/${currentExercise.sets.length}`) : null),
                                isCoverScreen ? null : e('div', { className: 'text-sm mt-0.5', style: { color: 'var(--on-surface-variant)' } }, `Set ${currentSetIndex + 1} of ${currentExercise.sets.length}`)
                            ),
                            // Progress dots
                            e('div', { className: 'flex gap-1.5 flex-wrap justify-end ml-3', style: { maxWidth: '45%' } },
                                liveWorkout.exercises.map((ex, i) =>
                                    e('div', { key: i, className: 'flex gap-1' },
                                        ex.sets.map((_, j) => {
                                            let bg;
                                            if (i < currentExerciseIndex || (i === currentExerciseIndex && j < currentSetIndex)) bg = 'var(--primary-container)';
                                            else if (i === currentExerciseIndex && j === currentSetIndex) bg = 'var(--secondary)';
                                            else bg = 'var(--surface-container-highest)';
                                            return e('div', { key: j, style: { width: 7, height: 7, borderRadius: '50%', background: bg } });
                                        })
                                    )
                                )
                            )
                        ),
                        // Timers row: day + total time (+ watch controls) | set time, or the rest
                        // countdown while the watch's rest timer runs (tap to stop it).
                        e('div', { className: 'flex items-center justify-between px-2 ' + (isCoverScreen ? 'mb-1 mt-1' : 'mb-4 mt-2') },
                            e('div', { className: 'flex items-center gap-3' },
                                e('span', { className: 'text-xs uppercase tracking-widest font-bold', style: { color: 'var(--on-surface-variant)' } }, liveWorkout.day),

                                watchPref ? e('button', {
                                    onClick: watchStatus === 'on' ? disconnectWatch : connectWatch, disabled: watchStatus === 'unsupported',

                const todayKey = dayKey(Date.now());

                const metricDays = new Set(metrics.map(m => dayKey(m.date)));

                const workoutDays = new Set(workoutHistory.map(w => dayKey(w.date)));

                // Build a Monday-first 6-week grid.
                const firstOfMonth = new Date(year, month, 1);
                const leading = (firstOfMonth.getDay() + 6) % 7; // 0 = Monday
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const cells = [];
                for (let i = 0; i < leading; i++) cells.push(null);
                for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(year, month, d, 12, 0, 0, 0));
                while (cells.length % 7 !== 0) cells.push(null);

                const shiftMonth = (delta) => { const d = new Date(year, month + delta, 1); d.setHours(0, 0, 0, 0); setCalCursor(d.getTime()); };

                    style: { background: 'var(--surface-container-highest)', color: 'var(--on-surface)' }
                }, e(MIcon, { icon, style: { fontSize: '20px' } }));

                const renderDayCell = (cell, idx) => {
                    if (!cell) return e('div', { key: idx });
                    const ck = dayKey(cell.getTime());
                    const isToday = ck === todayKey;
                    const isFuture = cell.getTime() > Date.now();
                    const has = [];
                    if (metricDays.has(ck)) has.push(dot('var(--primary-container)'));
                    if (photoDays.has(ck)) has.push(dot('#00e5ff'));
                    if (workoutDays.has(ck)) has.push(dot('var(--secondary)'));
                    if (foodDays.has(ck)) has.push(dot('var(--macro-c)'));

                        onClick: () => { setSelectedDay(new Date(cell.getFullYear(), cell.getMonth(), cell.getDate(), 12, 0, 0, 0).getTime()); },

                const ratingTargets = N ? N.targetsFor(profile, metrics) : null;
                const planDays = DAYS.filter(d => workouts[d]);
                const weekCell = (row) => {
                    const monday = new Date(year, month, 1 - leading + 7 * row).getTime();
                    const r = N ? N.weekRating({ mondayMs: monday, history: workoutHistory, planDays, log: foodLog, targets: ratingTargets, now: Date.now() }) : null;

                                    ))) : e('div', { className: 'text-sm', style: { color: 'var(--outline)' } }, 'No photos for this day.')

                    e('div', { className: 'flex-1 pt-20 px-4 pb-28 overflow-y-auto' },

                const numField = (label, value, onChange, ph, suffix) => e('div', null,

                // ---- GOALS ----

                    const sub = (t) => e('div', { className: 'text-xs uppercase tracking-widest mb-2', style: { color: 'var(--on-surface-variant)' } }, t);

                    return shell('PROGRESS PHOTOS', true,

                if (progressSub === 'chat') {

                    const remaining = Math.max(0, DAILY_AI_LIMIT - aiUsedToday());
                    const conv = chats.find(c => c.id === chatId) || null;
                    const msgs = conv ? conv.messages : [];
                    const dayLabel = (ts) => {

                    const groups = [];
                    let curKey = null;

                                e('div', { className: 'text-sm font-bold truncate', style: { color: c.id === chatId ? 'var(--primary-fixed-dim)' : 'var(--on-surface)' } }, c.title),
                                e('div', { className: 'text-xs mt-0.5', style: { color: 'var(--on-surface-variant)' } }, `${dayLabel(c.updated)} · ${c.messages.length} message${c.messages.length === 1 ? '' : 's'}`)),
                            e('button', { onClick: () => deleteChat(c), 'aria-label': 'Delete ' + c.title, className: 'w-11 h-11 flex items-center justify-center flex-shrink-0 active:opacity-60', style: { color: 'var(--on-surface-variant)' } }, e(MIcon, { icon: 'delete', style: { fontSize: '20px' } }))
                        ))) : e('div', { className: 'text-sm px-1', style: { color: 'var(--outline)' } }, 'No chats yet.'),

                    e('div', { className: 'flex-1 min-w-0' },
                        nextW ? e('div', { className: 'text-xs font-bold uppercase tracking-widest', style: { color: nextSt === 'missed' ? 'var(--warn)' : 'var(--primary-container)' } }, `${heroLabel} · ${nextDay}`)
                            : e('div', { className: 'text-xs font-bold uppercase tracking-widest', style: { color: 'var(--primary-container)' } }, week.planned ? 'Week complete' : 'No plan yet'),
                        e('div', { className: 'font-black leading-tight truncate', style: { fontSize: coverPlan ? 22 : 28 } }, nextW ? nextW.name : week.planned ? 'All done' : 'Add your first workout'),
                        nextW ? e('div', { className: 'text-sm', style: { color: 'var(--on-surface-variant)' } }, exCount(nextW))
                            : e('div', { className: 'text-sm', style: { color: 'var(--on-surface-variant)' } }, week.planned ? 'Start any day below to train again.' : 'Tap a day below to plan it.')
                    )
                ),
                nextW && !coverPlan ? e('div', { className: 'flex flex-wrap gap-1.5 mt-3' },
                    nextW.exercises.slice(0, 3).map((ex, i) => e('span', { key: i, className: 'px-2.5 py-1 rounded-full text-xs', style: { background: 'var(--surface-container-highest)', color: 'var(--on-surface)' } }, `${ex.name || 'Exercise'} ${ex.sets.length}×`)),
                    nextW.exercises.length > 3 ? e('span', { className: 'px-2.5 py-1 rounded-full text-xs', style: { background: 'var(--surface-container-highest)', color: 'var(--on-surface-variant)' } }, `+${nextW.exercises.length - 3}`) : null
                ) : null,
                nextW ? e('button', {
                    onClick: () => startWorkout(nextDay),
                    className: 'w-full rounded-2xl font-black uppercase tracking-wide transition-all active:scale-95 ' + (coverPlan ? 'mt-2.5 py-2.5 text-lg' : 'mt-3 py-3.5 text-xl'),
                    style: { background: 'var(--primary-container)', color: 'var(--on-primary-container)', boxShadow: '0 0 24px rgba(209,252,0,0.2)' }
                }, nextSt === 'progress' ? 'Continue workout' : nextSt === 'missed' ? `Start ${nextDay}'s workout` : 'Start workout') : null,
                nextW && nextSt === 'missed' && week.missed.length > 1 ? e('div', { className: 'text-xs mt-2 text-center', style: { color: 'var(--on-surface-variant)' } }, `${week.missed.length} missed this week — they start in order.`) : null
            );
            const dayRow = (day) => {
                const w = workouts[day];
                const st = week.status[day];
                const meta = STATUS[st];
                return e('div', { key: day, className: 'flex items-center gap-3', style: { minHeight: coverPlan ? 48 : 56, borderBottom: '1px solid var(--surface-container-high)' } },
                    statusDot(st),
                    e('button', {
                        onClick: () => openEditor(day), 'aria-label': w ? `Edit ${day}: ${w.name}` : `Plan a workout for ${day}`,
                        className: 'flex-1 min-w-0 flex items-center gap-3 text-left py-2 active:opacity-70'
                    },
                        e('div', { className: 'w-12 flex-shrink-0 leading-tight' },
                            e('div', { className: 'text-sm font-bold', style: { color: st === 'today' || st === 'progress' ? 'var(--primary-container)' : 'var(--on-surface)' } }, day.slice(0, 3)),
                            e('div', { className: 'text-xs', style: { color: 'var(--on-surface-variant)' } }, fmtDayDate(day))
                        ),
                        e('div', { className: 'flex-1 min-w-0' },
                            e('div', { className: 'text-base font-bold truncate', style: { color: w ? 'var(--on-surface)' : 'var(--outline)', fontWeight: w ? 700 : 400 } }, w ? w.name : 'Rest'),
                            w && !coverPlan ? e('div', { className: 'text-xs truncate', style: { color: 'var(--on-surface-variant)' } }, exCount(w)) : null
                        ),
                        meta.label ? e('span', { className: 'text-xs font-bold flex-shrink-0', style: { color: meta.color } }, meta.label) : null
                    ),
                    w ? e('button', {
                        onClick: () => startWorkout(day), 'aria-label': `Start ${day}: ${w.name}`,
                        className: 'w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 active:scale-90',
                        style: day === nextDay ? { background: 'var(--primary-container)', color: 'var(--on-primary-container)' } : { background: 'var(--surface-container-highest)', color: 'var(--primary-fixed-dim)' }
                    }, e(MIcon, { icon: 'play_arrow', fill: true, style: { fontSize: '22px' } }))
                    : e('button', {
                        onClick: () => openEditor(day), 'aria-label': `Add workout on ${day}`,
                        className: 'w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 active:scale-90',
                        style: { background: 'transparent', color: 'var(--on-surface-variant)', border: '1px solid var(--outline-variant)' }
                    }, e(MIcon, { icon: 'add', style: { fontSize: '20px' } }))
                );
            };

            return e('div', {
                className: 'min-h-screen flex flex-col',
                style: { background: 'var(--void)', color: 'var(--on-surface)' }
            },
                e(TopAppBar, { title: 'PLAN', rightAction: profileBtn }),
                e('main', { className: 'flex-1 pt-20 px-4 pb-28' },
                    e('div', { className: 'max-w-lg mx-auto' },
                        e('div', { className: 'text-xs font-bold uppercase tracking-widest mb-2 px-1', style: { color: 'var(--on-surface-variant)' } },
                            `Week ${getWeekNumber(currentDate)} · ${fmtDayDate('Monday')}–${fmtDayDate('Sunday')}` + (week.planned ? ` · ${week.done} of ${week.planned} done` : '')),
                        heroCard,
                        e('div', { className: 'mt-3' }, DAYS.map(dayRow))
                    )
                ),
                e(BottomNavBar, { activeTab, onTabChange: handleTabChange })
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(e(WorkoutApp));
    </script>
</body>
</html>
