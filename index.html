            const [foodDate, setFoodDate] = useState(() => dayKey(Date.now()));
            // Health data from the Android companion (js/health.js): { 'YYYY-MM-DD': { hc, weighins } }. Read-only here.
            const [healthLog, setHealthLog] = useState({});
            const [healthLoading, setHealthLoading] = useState(false);
            const healthReadAt = useRef(0);
            const foodRangesRef = useRef(new Set());      // older diary ranges already fetched
            const [progressSub, setProgressSub] = useState('hub'); // hub | goals | metrics | photos | chat | settings
            const [photos, setPhotos] = useState([]);   // loaded from IndexedDB (local only)
            const [aiBusy, setAiBusy] = useState(false);
            const [aiError, setAiError] = useState('');
            const [toast, setToast] = useState('');
            const chatScrollRef = useRef(null);
            // Month calendar: cursor = first-of-month being shown; selectedDay = day sheet open
            const [calCursor, setCalCursor] = useState(() => { const d = new Date(); d.setDate(1); d.setHours(0, 0, 0, 0); return d.getTime(); });
            const [selectedDay, setSelectedDay] = useState(null); // ms at noon of the picked day, or null
            const [monthPicker, setMonthPicker] = useState(false);
            const [weekInfo, setWeekInfo] = useState(null); // week rating shown in the breakdown dialog

            // Cover screen detection (flip phone: nearly square aspect) — shared hook
            const viewport = useViewport();
            const isCoverScreen = viewport.isCover;
            // Confirmation dialog state: { title, message, confirmLabel, onConfirm }
            const [confirmState, setConfirmState] = useState(null);

            // Check for old app data in localStorage
            const getOldAppData = () => {
                try {
                    const old = localStorage.getItem('workout-tracker-data');
                    if (old) {
                        const parsed = JSON.parse(old);
                        if (Object.keys(parsed).length > 0) return parsed;
                    }
                } catch (err) {}
                return null;
            };

            // --- Auth functions ---
            // Load a signed-in Firebase user's data into app state. Offline-safe: if the
            // cloud read fails (no network) but we have a local cache for this uid, use the
            // cache instead of wiping the view; only create a fresh record for a truly new uid.
            const loadFbUser = async (u) => {
                const uid = u.uid;
                const read = await cloudReadUser(uid);
                let userData = read.ok ? read.data : null;
                if (!userData) {
                    const localW = localStorage.getItem('cwa-workouts-' + uid);
                    if (localW != null) {
                        userData = { email: u.email || '', createdAt: Date.now(), workouts: JSON.parse(localW || '{}') , history: JSON.parse(localStorage.getItem('cwa-history-' + uid) || '[]') };
                    } else if (read.ok) {
                        // Genuinely new account (first sign-in) — create an empty record.
                        userData = { email: u.email || '', createdAt: Date.now(), workouts: {}, history: [] };
                        await cloudSet('users/' + uid, userData);
                    } else {
                        // Cloud unreachable and nothing cached on this device: don't start an empty
                        // account (its first sync would overwrite the real data). Ask to retry.
                        throw new Error('offline-no-cache');
                    }
                }
                try { localStorage.setItem(LAST_FB_USER, JSON.stringify({ uid, email: u.email || '' })); } catch (e) {}
                setCurrentUser({ username: uid, email: u.email || userData.email || '', createdAt: userData.createdAt || Date.now() });
                const lw = sanitizeWorkouts(preferUnsyncedLocal(uid, 'workouts', userData.workouts) || {});
                setWorkouts(lw);
                setWorkoutHistory(preferUnsyncedLocal(uid, 'history', userData.history) || []);
                hydrateProgress(uid, userData);
                if (!resumeSessionIfAny(lw, uid)) setView('landing');
                setIsLoading(false);
            };

            const doGoogle = async () => {
                if (!fbAuthEnabled()) { setAuthError('Sign-in unavailable right now.'); return; }
                setAuthLoading(true); setAuthError('');
                try {
                    const u = await fbSignInGoogle();
                    if (u) { await loadFbUser(u); setAuthLoading(false); }
                    // else: a popup was blocked and we redirected — page will navigate away.
                } catch (err) { setAuthError(fbMapError(err)); setAuthLoading(false); }
            };

            const doLogin = async () => {
                // Secure Firebase Auth path (email/password). Active only when secure mode is on.
                if (fbAuthEnabled()) {
                    if (!loginUsername.trim() || !loginPassword.trim()) { setAuthError('Enter email and password'); return; }
                    setAuthLoading(true); setAuthError('');
                    try {
                        const u = await fbSignInEmail(loginUsername.trim(), loginPassword);
                        await loadFbUser(u);
                    } catch (err) { setAuthError(fbMapError(err)); }
                    setAuthLoading(false);
                    return;
                }
                if (!loginUsername.trim() || !loginPassword.trim()) { setAuthError('Enter username and password'); return; }
                setAuthLoading(true);
                setAuthError('');
                const uname = loginUsername.trim().toLowerCase();
                const pHash = await hashPassword(loginPassword);
                if (cloudEnabled()) {
                    const userData = await cloudGet('users/' + uname);
                    if (!userData) { setAuthError('User not found. Register first.'); setAuthLoading(false); return; }
                    if (userData.passwordHash !== pHash) { setAuthError('Wrong password'); setAuthLoading(false); return; }
                    setCurrentUser({ username: uname, createdAt: userData.createdAt || Date.now() });
                    const loadedWorkouts = sanitizeWorkouts(preferUnsyncedLocal(uname, 'workouts', userData.workouts) || {});
                    const loadedHistory = preferUnsyncedLocal(uname, 'history', userData.history) || [];
                    setWorkouts(loadedWorkouts);
                    setWorkoutHistory(loadedHistory);
                    hydrateProgress(uname, userData);
                    localStorage.setItem('cwa-user', JSON.stringify({ username: uname, passwordHash: pHash }));
                    // Check for old data to migrate (only if account has no workouts)
                    if (Object.keys(loadedWorkouts).length === 0) {
                        const oldData = getOldAppData();
                        if (oldData) { setPendingMigration(oldData); setView('migrate'); setAuthLoading(false); return; }
                    }
                } else {
                    const localUser = localStorage.getItem('cwa-user-' + uname);
                    if (!localUser) { setAuthError('User not found. Register first.'); setAuthLoading(false); return; }
                    const parsed = JSON.parse(localUser);
                    if (parsed.passwordHash !== pHash) { setAuthError('Wrong password'); setAuthLoading(false); return; }
                    setCurrentUser({ username: uname, createdAt: parsed.createdAt || Date.now() });
                    const w = localStorage.getItem('cwa-workouts-' + uname);
                    const h = localStorage.getItem('cwa-history-' + uname);
                    if (w) setWorkouts(sanitizeWorkouts(JSON.parse(w)));
                    else {
                        const oldData = getOldAppData();
                        if (oldData) { setPendingMigration(oldData); setView('migrate'); setAuthLoading(false); localStorage.setItem('cwa-user', JSON.stringify({ username: uname, passwordHash: pHash })); return; }
                    }
                    if (h) setWorkoutHistory(JSON.parse(h));
                    hydrateProgress(uname, null);
                    localStorage.setItem('cwa-user', JSON.stringify({ username: uname, passwordHash: pHash }));
                }
                setView('landing');
                setIsLoading(false);
                setAuthLoading(false);
            };

            const doRegister = async () => {
                if (fbAuthEnabled()) {
                    if (!loginUsername.trim() || !loginPassword.trim()) { setAuthError('Enter email and password'); return; }
                    if (loginPassword.trim().length < 6) { setAuthError('Password must be at least 6 characters'); return; }
                    setAuthLoading(true); setAuthError('');
                    try {
                        const u = await fbRegisterEmail(loginUsername.trim(), loginPassword);
                        await loadFbUser(u); // creates the empty record for the new uid
                    } catch (err) { setAuthError(fbMapError(err)); }
                    setAuthLoading(false);
                    return;
                }
                if (!loginUsername.trim() || !loginPassword.trim()) { setAuthError('Enter username and password'); return; }
                if (loginPassword.trim().length < 4) { setAuthError('Password must be at least 4 characters'); return; }
                setAuthLoading(true);
                setAuthError('');
                const uname = loginUsername.trim().toLowerCase();
                const pHash = await hashPassword(loginPassword);
                if (cloudEnabled()) {
                    const existing = await cloudGet('users/' + uname);
                    if (existing) { setAuthError('Username already taken'); setAuthLoading(false); return; }
                    const userData = { passwordHash: pHash, createdAt: Date.now(), workouts: {}, history: [] };
                    await cloudSet('users/' + uname, userData);
                    setCurrentUser({ username: uname, createdAt: userData.createdAt });
                    localStorage.setItem('cwa-user', JSON.stringify({ username: uname, passwordHash: pHash }));
                } else {
                    const localUser = localStorage.getItem('cwa-user-' + uname);
                    if (localUser) { setAuthError('Username already taken'); setAuthLoading(false); return; }
                    const userData = { passwordHash: pHash, createdAt: Date.now() };
                    localStorage.setItem('cwa-user-' + uname, JSON.stringify(userData));
                    setCurrentUser({ username: uname, createdAt: userData.createdAt });
                    localStorage.setItem('cwa-user', JSON.stringify({ username: uname, passwordHash: pHash }));
                }
                // Check for old data to migrate into the new account
                const oldData = getOldAppData();
                if (oldData) {
                    setPendingMigration(oldData);
                    setView('migrate');
                    setIsLoading(false);
                    setAuthLoading(false);
                    return;
                }
                setWorkouts({});
                setWorkoutHistory([]);
                setView('landing');
                setIsLoading(false);
                setAuthLoading(false);
            };

            const doMigrationImport = () => {
                if (pendingMigration) {
                    setWorkouts(pendingMigration);
                    setPendingMigration(null);
                }
                setView('landing');
            };

            const doMigrationSkip = () => {
                setPendingMigration(null);
                setView('landing');
            };

            const doLogout = () => {
                setCurrentUser(null);
                setWorkouts({});
                setWorkoutHistory([]);
                setProfile(DEFAULT_PROFILE);
                setMetrics([]);
                setRecaps([]);
                setChats([]); setChatId(null); setCoachMemory([]);
                setAiUsage({ date: '', count: 0 });
                setFoodLog({});
                setFoods({});
                setScaleSkips({});
                setHealthLog({});
                setPhotos([]);
                setProgressSub('hub');
                setView('login');
                setLoginUsername('');
                setLoginPassword('');
                setShowProfile(false);
                localStorage.removeItem('cwa-user');
                localStorage.removeItem(LAST_FB_USER);
                fbSignOut();
            };

            // Coalescing, serialized cloud writer. Local save is immediate; cloud writes are
            // queued so they run strictly in order and always end on the LATEST state. This
            // kills the last-write-wins race where a slow earlier write (with an active
            // `progress`) could land after the completion write and resurrect a finished
            // workout hours/days later.
            const syncRef = useRef({ pending: null, running: false });
            const syncToCloud = (w, h) => {
                if (!currentUser) return;
                const uname = currentUser.username;
                try {
                    localStorage.setItem('cwa-workouts-' + uname, JSON.stringify(w));
                    localStorage.setItem('cwa-history-' + uname, JSON.stringify(h));
                } catch (err) {}
                if (!cloudEnabled()) return;
                syncRef.current.pending = { uname, w, h };
                if (syncRef.current.running) return;
                syncRef.current.running = true;
                (async () => {
                    while (syncRef.current.pending) {
                        const job = syncRef.current.pending;
                        syncRef.current.pending = null;
                        try {
                            unsyncedMark(job.uname, 'workouts', await cloudSet('users/' + job.uname + '/workouts', job.w));
                            unsyncedMark(job.uname, 'history', await cloudSet('users/' + job.uname + '/history', job.h));
                        } catch (err) {}
                    }
                    syncRef.current.running = false;
                })();
            };

            // Persist a single progress field (profile / metrics / recaps) locally + cloud.
            const cloudSaveField = async (field, value) => {
                if (!currentUser) return;
                const uname = currentUser.username;
                try { localStorage.setItem('cwa-' + field + '-' + uname, JSON.stringify(value)); } catch (err) {}
                if (cloudEnabled()) unsyncedMark(uname, field, await cloudSet('users/' + uname + '/' + field, value));
            };

            // Hydrate progress data from a loaded user record (cloud) or localStorage.
            const hydrateProgress = (uname, src) => {
                const pick = (field, fallback) => {
                    if (src && src[field] != null) return preferUnsyncedLocal(uname, field, src[field]);
                    try { const raw = localStorage.getItem('cwa-' + field + '-' + uname); if (raw) return JSON.parse(raw); } catch (err) {}
                    return fallback;
                };
                // The bulk/cut/... selector was replaced by free-text notes: carry an old choice over.
                const prof = { ...DEFAULT_PROFILE, ...(pick('profile', {}) || {}) };
                if (prof.goal) {
                    const g = String(prof.goal);
                    if (!(prof.notes || '').toLowerCase().includes(g.toLowerCase())) prof.notes = (`Goal: ${g}. ` + (prof.notes || '')).slice(0, PROFILE_NOTES_MAX);
                    prof.goal = '';
                }
                setProfile(prof);
                setMetrics(pick('metrics', []) || []);
                setRecaps(pick('recaps', []) || []);
                let convs = pick('chats', []);
                if (!Array.isArray(convs)) convs = [];
                const legacy = pick('chat', []);
                if (Array.isArray(legacy) && legacy.length) {
                    if (!convs.length) convs = chatsFromLegacy(legacy);
                    legacyChatRef.current = true;
                }
                setChats(convs.filter(c => c && Array.isArray(c.messages)));
                const mem = pick('coachMemory', []);
                setCoachMemory(Array.isArray(mem) ? mem.filter(m => m && m.text) : []);
                setAiUsage(pick('aiUsage', { date: '', count: 0 }) || { date: '', count: 0 });
                setFoods(pick('foods', {}) || {});
                const skips = pick('scaleSkips', {});
                setScaleSkips(skips && typeof skips === 'object' && !Array.isArray(skips) ? skips : {});
                setHealthLog((src && src.health) || pick('health', {}) || {});
                healthReadAt.current = src && src.health ? Date.now() : 0;
                // cloudReadUser marks how far back its diary read went (foodLogSince); a record
                // without it (offline fallback, legacy full read) leaves the local days alone.
                const cloudLog = src && src.foodLogSince ? (src.foodLog || {}) : (src ? src.foodLog : undefined);
                const log = mergeFoodLog(uname, cloudLog, src && src.foodLogSince);
                writeLocalFoodLog(uname, log);
                setFoodLog(log);
                foodRangesRef.current = new Set();
                setFoodDate(dayKey(Date.now()));
            };

            // --- Food diary saving: local immediately, cloud one day per write, serialized so a
            // slow earlier write can't land after a newer one (same idea as syncToCloud). ---
            const foodSyncRef = useRef({ pending: {}, running: false });
            const queueFoodWrite = (uname, day, entries) => {
                unsyncedMark(uname, 'foodLog/' + day, false); // cleared once the cloud has it
                if (!cloudEnabled()) return;
                const q = foodSyncRef.current;
                q.pending[uname + '|' + day] = { uname, day, entries };
                if (q.running) return;
                q.running = true;
                (async () => {
                    let k;
                    while ((k = Object.keys(q.pending)[0])) {
                        const job = q.pending[k];
                        delete q.pending[k];
                        const ok = await cloudSet('users/' + job.uname + '/foodLog/' + job.day, job.entries && job.entries.length ? job.entries : null);
                        if (ok && !q.pending[k]) unsyncedMark(job.uname, 'foodLog/' + job.day, true);
                    }
                    q.running = false;
                })();
            };
            const saveFoodDay = (day, entries) => {
                if (!currentUser) return;
                const uname = currentUser.username;
                setFoodLog(prev => {
                    const next = { ...prev };
                    if (entries && entries.length) next[day] = entries; else delete next[day];
                    writeLocalFoodLog(uname, next);
                    return next;
                });
                queueFoodWrite(uname, day, entries);
            };
            // Fetch diary days older than the startup window (calendar months, date browsing).
            const loadFoodRange = async (startKey, endKey) => {
                if (!currentUser || !cloudEnabled()) return;
                const recentSince = dayKey(Date.now() - FOOD_LOG_RECENT_DAYS * DAY_MS);
                if (startKey >= recentSince) return;
                const id = startKey + '_' + endKey;
                if (foodRangesRef.current.has(id)) return;
                foodRangesRef.current.add(id);
                const uname = currentUser.username;
                const r = await cloudReadFoodRange(uname, startKey, endKey);
                if (!r.ok) { foodRangesRef.current.delete(id); return; }
                const unsynced = new Set(unsyncedGet(uname));
                setFoodLog(prev => {
                    const next = { ...prev };
                    let changed = false;
                    Object.keys(next).forEach(d => { if (d >= startKey && d <= endKey && !r.data[d] && !unsynced.has('foodLog/' + d)) { delete next[d]; changed = true; } });
                    Object.keys(r.data).forEach(d => { if (Array.isArray(r.data[d]) && r.data[d].length && !unsynced.has('foodLog/' + d)) { next[d] = r.data[d]; changed = true; } });
                    if (!changed) return prev;
                    writeLocalFoodLog(uname, next);
                    return next;
                });
            };

            // --- Tab switching logic ---
            const handleTabChange = (tabId) => {
                if (tabId === 'calendar') {
                    setActiveTab('calendar');
                    setView('landing');
                    // Don't reset edit state - just go back to calendar grid
                } else if (tabId === 'workout') {
                    setActiveTab('workout');
                    if (view === 'live' || view === 'complete') {
                        // Already in a workout flow, stay there
                    } else if (liveWorkout) {
                        setView('live');
                    } else {
                        setView('workout-idle');
                    }
                } else if (tabId === 'food') {
                    setActiveTab('food');
                    setView('food');
                } else if (tabId === 'month') {
                    setActiveTab('month');
                    setView('calendarMonth');
                } else if (tabId === 'progress') {
                    setActiveTab('progress');
                    setProgressSub('hub');
                    setAiError('');
                    setView('progress');
                } else if (tabId === 'health') {
                    setActiveTab('health');
                    setView('health');
                } else if (tabId === 'stats') { // from Profile (Stats used to be a tab)
                    setActiveTab('progress');
                    setView('stats');
                }
            };
            // A Profile page from elsewhere (e.g. Goals or the weight chart from the Health tab).
            const openProfile = (sub) => { setActiveTab('progress'); setAiError(''); setProgressSub(sub || 'hub'); setView('progress'); };

            // --- Auto-login on mount ---
            useEffect(() => {
                const tryAutoLogin = async () => {
                    // Secure Firebase Auth path: complete any Google redirect, then restore the
                    // persisted session via the SDK (works offline from cached auth state).
                    if (fbAuthEnabled()) {
                        try {
                            await fbGetRedirectUser(); // finishes a Google redirect sign-in if returning from one
                            // The SDK re-checks a persisted account with Google before reporting it,
                            // which can stall for a minute on a weak signal. After 6s, open the last
                            // signed-in account from this device's copy instead; cloud writes resume
                            // once the SDK catches up (unsynced changes are kept, see unsyncedMark).
                            const u = await withTimeout(fbCurrentUserOnce(), 6000, undefined);
                            if (u) { await loadFbUser(u); return; }
                            if (u === undefined) {
                                let last = null;
                                try { last = JSON.parse(localStorage.getItem(LAST_FB_USER) || 'null'); } catch (e) {}
                                if (last && last.uid && localStorage.getItem('cwa-workouts-' + last.uid) != null) { await loadFbUser(last); return; }
                            }
                        } catch (err) {
                            console.log('FB auto-login failed:', err);
                            if (err && err.message === 'offline-no-cache') setAuthError(fbMapError(err));
                        }
                        setIsLoading(false);
                        return;
                    }
                    try {
                        const savedSession = localStorage.getItem('cwa-user');
                        if (savedSession) {
                            const { username, passwordHash } = JSON.parse(savedSession);
                            if (cloudEnabled()) {
                                const userData = await cloudGet('users/' + username);
                                if (userData && userData.passwordHash === passwordHash) {
                                    setCurrentUser({ username, createdAt: userData.createdAt || Date.now() });
                                    const lw = sanitizeWorkouts(preferUnsyncedLocal(username, 'workouts', userData.workouts) || {});
                                    setWorkouts(lw);
                                    setWorkoutHistory(preferUnsyncedLocal(username, 'history', userData.history) || []);
                                    hydrateProgress(username, userData);
                                    // Drop straight back into an in-progress workout if there is one.
                                    if (!resumeSessionIfAny(lw, username)) setView('landing');
                                    setIsLoading(false);
                                    return;
                                }
                            }
                            // Fallback to local
                            const localUser = localStorage.getItem('cwa-user-' + username);
                            if (localUser) {
                                const parsed = JSON.parse(localUser);
                                if (parsed.passwordHash === passwordHash) {
                                    setCurrentUser({ username, createdAt: parsed.createdAt || Date.now() });
                                    const w = localStorage.getItem('cwa-workouts-' + username);
                                    const h = localStorage.getItem('cwa-history-' + username);
                                    const lw = sanitizeWorkouts(w ? JSON.parse(w) : {});
                                    if (w) setWorkouts(lw);
                                    if (h) setWorkoutHistory(JSON.parse(h));
                                    hydrateProgress(username, null);
                                    if (!resumeSessionIfAny(lw, username)) setView('landing');
                                    setIsLoading(false);
                                    return;
                                }
                            }
                        }
                    } catch (err) { console.log('Auto-login failed:', err); }
                    setIsLoading(false);
                };
                tryAutoLogin();
            }, []);

            // --- Sync on data change ---
            useEffect(() => {
                if (!isLoading && currentUser) {
                    syncToCloud(workouts, workoutHistory);
                }
            }, [workouts, workoutHistory]);
            useEffect(() => { if (!isLoading && currentUser) cloudSaveField('profile', profile); }, [profile]);
            useEffect(() => { if (!isLoading && currentUser) cloudSaveField('metrics', metrics); }, [metrics]);
            useEffect(() => { if (!isLoading && currentUser) cloudSaveField('recaps', recaps); }, [recaps]);
            useEffect(() => {
                if (isLoading || !currentUser) return;
                cloudSaveField('chats', chats);
                if (legacyChatRef.current) { legacyChatRef.current = false; cloudSaveField('chat', []); }
            }, [chats]);
            useEffect(() => { if (!isLoading && currentUser) cloudSaveField('aiUsage', aiUsage); }, [aiUsage]);
            useEffect(() => { if (!isLoading && currentUser) cloudSaveField('coachMemory', coachMemory); }, [coachMemory]);
            // Health data: kept on the device for offline starts (never written back from here).
            useEffect(() => {
                if (isLoading || !currentUser) return;
                try { localStorage.setItem('cwa-health-' + currentUser.username, JSON.stringify(healthLog)); } catch (err) {}
            }, [healthLog]);
            // The phone syncs in the background: re-read health days when CWA comes back to the screen.
            const refreshHealth = async (force) => {
                if (!currentUser || !cloudEnabled()) return;
                if (!force && Date.now() - healthReadAt.current < 120000) return;
                healthReadAt.current = Date.now();
                setHealthLoading(true);
                const since = dayKey(Date.now() - FOOD_LOG_RECENT_DAYS * DAY_MS);
                const r = await cloudRead('users/' + currentUser.username + '/health', 10000, foodRangeParams(since));
                if (r.ok) setHealthLog((r.data && typeof r.data === 'object') ? r.data : {});
                setHealthLoading(false);
            };
            useEffect(() => {
                const onVis = () => { if (document.visibilityState === 'visible') refreshHealth(false); };
                document.addEventListener('visibilitychange', onVis);
                return () => document.removeEventListener('visibilitychange', onVis);
            }, [currentUser]);
            // Scale weigh-ins → the Daily Log (one entry per day; a weight typed by hand wins, and a
            // weigh-in deleted from the log stays deleted).
            useEffect(() => {
                if (isLoading || !currentUser || !window.CWAHealth) return;
                setMetrics(prev => window.CWAHealth.mergeWeighIns(prev, healthLog, profile, scaleSkips) || prev);
            }, [healthLog, scaleSkips, profile.sex, profile.birthYear, profile.heightCm, isLoading]);
            useEffect(() => { if (!isLoading && currentUser) cloudSaveField('scaleSkips', scaleSkips); }, [scaleSkips]);
            useEffect(() => { if (!isLoading && currentUser) cloudSaveField('foods', foods); }, [foods]);
            // Upload diary days that were changed without a connection last time.
            useEffect(() => {
                if (isLoading || !currentUser) return;
                const uname = currentUser.username;
                const local = readLocalFoodLog(uname);
                unsyncedGet(uname).filter(f => f.startsWith('foodLog/')).forEach(f => { const d = f.slice(8); queueFoodWrite(uname, d, local[d] || null); });
            }, [isLoading, currentUser]);
            // Older diary days for the calendar month / Food date being viewed.
            useEffect(() => {
                if (isLoading || !currentUser) return;
                if (view === 'calendarMonth') {
                    const c = new Date(calCursor);
                    loadFoodRange(dayKey(new Date(c.getFullYear(), c.getMonth(), 1).getTime()), dayKey(new Date(c.getFullYear(), c.getMonth() + 1, 0).getTime()));
                } else if (view === 'food') {
                    const [y, m] = foodDate.split('-').map(Number);
                    loadFoodRange(dayKey(new Date(y, m - 1, 1).getTime()), dayKey(new Date(y, m, 0).getTime()));
                }
            }, [view, calCursor, foodDate, isLoading, currentUser]);
            // Keep the chat scrolled to the newest message.
            useEffect(() => {
                if (progressSub === 'chat' && chatScrollRef.current) {
                    chatScrollRef.current.scrollTop = chatListOpen ? 0 : chatScrollRef.current.scrollHeight;
                }
            }, [chats, chatId, aiBusy, progressSub, chatListOpen]);
            // Opening the coach continues today's conversation, otherwise starts a new one.
            useEffect(() => {
                if (progressSub !== 'chat') return;
                const latest = chats[0];
                setChatId(latest && dayKey(latest.updated) === dayKey(Date.now()) ? latest.id : null);
                setChatListOpen(false);
            }, [progressSub]);

            // Load this user's progress photos from IndexedDB whenever the user changes.
            useEffect(() => {
                let cancelled = false;
                if (currentUser) {
                    photoList(currentUser.username).then(list => { if (!cancelled) setPhotos(list); }).catch(() => {});
                } else {
                    setPhotos([]);
                }
                return () => { cancelled = true; };
            }, [currentUser]);

            const refreshPhotos = async () => {
                if (!currentUser) return;
                try { setPhotos(await photoList(currentUser.username)); } catch (err) {}
            };

            // Auto-dismiss transient toast messages.
            useEffect(() => {
                if (!toast) return;
                const t = setTimeout(() => setToast(''), 2200);
                return () => clearTimeout(t);
            }, [toast]);

            const saveToHistory = (workout, elapsedTime, totalScore, maxScore) => {
                const entry = {
                    date: Date.now(),
                    day: workout.day,
                    name: workout.name,
                    totalTime: elapsedTime,
                    score: totalScore || 0,
                    maxScore: maxScore || 0,
                    exercises: workout.exercises.map(ex => ({
                        name: ex.name,
                        sets: ex.sets.map(s => ({ reps: s.reps, weight: s.weight }))
                    }))
                };
                // One unified session per calendar day per day-slot. If today's workout was
                // already logged (started/finished more than once after tweaking settings,
                // re-running it, etc.), REPLACE that entry rather than appending a duplicate —
                // duplicates pollute the trend data the AI recaps rely on. Keyed on calendar
                // date + day-slot (not name) so renaming mid-day still collapses to one.
                setWorkoutHistory(prev => {
                    const ek = dayKey(entry.date);
                    const dupIdx = prev.findIndex(h => h.day === entry.day && dayKey(h.date) === ek);
                    if (dupIdx !== -1) {
                        const copy = prev.slice();
                        copy[dupIdx] = entry;
                        return copy;
                    }
                    return [...prev, entry];
                });
            };

            const deleteFromHistory = (idx) => {
                setWorkoutHistory(prev => prev.filter((_, i) => i !== idx));
                setExpandedHistoryIdx(null);
            };

            const getExerciseHistory = (exerciseName) => {
                const entries = [];
                for (let i = workoutHistory.length - 1; i >= 0 && entries.length < 5; i--) {
                    const w = workoutHistory[i];
                    const ex = w.exercises.find(x => x.name === exerciseName);
                    if (ex) {
                        const maxWeight = Math.max(...ex.sets.map(s => s.weight));
                        const totalReps = ex.sets.reduce((sum, s) => sum + s.reps, 0);
                        const totalVol = ex.sets.reduce((sum, s) => sum + s.reps * s.weight, 0);
                        entries.unshift({ date: w.date, maxWeight, totalReps, totalVol, repsUp: false });
                    }
                }
                // Mark sessions where reps increased vs previous
                for (let i = 1; i < entries.length; i++) {
                    if (entries[i].totalReps > entries[i - 1].totalReps) {
                        entries[i].repsUp = true;
                    }
                }
                return entries;
            };

            // --- Timers ---
            useEffect(() => {
                let interval;
                if (workoutStartTime && view === 'live') {
                    interval = setInterval(() => {
                        const elapsedMs = Date.now() - workoutStartTime;
                        // Safety net: a session left running past the auto-end window is treated
                        // as abandoned and discarded (not saved), so it can't linger or log a
                        // bogus multi-hour workout into the recap data.
                        if (elapsedMs > AUTO_END_MS) {
                            cancelWorkout();
                            setToast('Workout auto-ended after 4h');
                            return;
                        }
                        setTotalElapsedTime(Math.floor(elapsedMs / 1000));
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [workoutStartTime, view]);

            useEffect(() => {
                let interval;
                if (setStartTime && view === 'live') {
                    interval = setInterval(() => { setCurrentSetTime(Math.floor((Date.now() - setStartTime) / 1000)); }, 1000);
                }
                return () => clearInterval(interval);
            }, [setStartTime, view]);

            // Watch controls: taken on in a workout only when the watch button is tapped (it pauses
            // Spotify & co. while on), released by tapping it again or when the workout ends.
            const disconnectWatch = () => { if (window.CWAWatch) window.CWAWatch.stop(); setWatchStatus('off'); };
            const connectWatch = () => {
                const W = window.CWAWatch;
                if (!W) return;
                W.start({
                    next: () => watchRef.current.next(), prev: () => watchRef.current.prev(),
                    // Rest started/ended, or the session was stopped from the phone's media controls.
                    change: () => { setWatchTick(t => t + 1); if (!W.active()) setWatchStatus(st => (st === 'on' ? 'off' : st)); },
                }).then(setWatchStatus);
            };
            useEffect(() => {
                if (view !== 'live' || !watchPref) disconnectWatch();
            }, [view, watchPref]);
            // What the watch shows: exercise, set, weight × reps.
            useEffect(() => {
                const W = window.CWAWatch;
                if (!W || watchStatus !== 'on' || view !== 'live' || !liveWorkout) return;
                const ex = liveWorkout.exercises[currentExerciseIndex];
                const st = ex && ex.sets[currentSetIndex];
                if (!st) return;
                W.update({
                    exercise: ex.name, workout: liveWorkout.name, set: `set ${currentSetIndex + 1}/${ex.sets.length}`,
                    load: st.weight ? `${fmtNum(st.weight)} kg × ${fmtNum(st.reps)}` : `${fmtNum(st.reps)} reps`,
                });
            }, [watchStatus, view, liveWorkout, currentExerciseIndex, currentSetIndex]);

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            };

            // --- Workout CRUD ---
            const startNewWorkout = () => {
                setEditingWorkout({ name: '', exercises: [{ name: '', notes: '', sets: [{ reps: 0, weight: 0 }, { reps: 0, weight: 0 }] }] });
                setView('edit');
            };

            const addExercise = () => {
                setEditingWorkout({ ...editingWorkout, exercises: [...editingWorkout.exercises, { name: '', notes: '', sets: [{ reps: 0, weight: 0 }, { reps: 0, weight: 0 }] }] });
            };

            const addSet = (exerciseIndex) => {
                const newExercises = [...editingWorkout.exercises];
                newExercises[exerciseIndex].sets.push({ reps: 0, weight: 0 });
                setEditingWorkout({ ...editingWorkout, exercises: newExercises });
            };

            const updateExerciseName = (exerciseIndex, name) => {
                const newExercises = [...editingWorkout.exercises];
                newExercises[exerciseIndex].name = name;
                setEditingWorkout({ ...editingWorkout, exercises: newExercises });
            };

            const updateExerciseNotes = (exerciseIndex, notes) => {
                const newExercises = [...editingWorkout.exercises];
                newExercises[exerciseIndex].notes = notes;
                setEditingWorkout({ ...editingWorkout, exercises: newExercises });
            };

            const updateSet = (exerciseIndex, setIndex, field, value) => {
                const newExercises = [...editingWorkout.exercises];
                const parsedValue = value === '' ? 0 : parseFloat(value);
                newExercises[exerciseIndex].sets[setIndex][field] = isNaN(parsedValue) ? 0 : parsedValue;
                setEditingWorkout({ ...editingWorkout, exercises: newExercises });
            };

            const removeSet = (exerciseIndex, setIndex) => {
                const newExercises = [...editingWorkout.exercises];
                if (newExercises[exerciseIndex].sets.length > 1) {
                    newExercises[exerciseIndex].sets.splice(setIndex, 1);
                    setEditingWorkout({ ...editingWorkout, exercises: newExercises });
                }
            };

            const removeExercise = (exerciseIndex) => {
                const newExercises = [...editingWorkout.exercises];
                if (newExercises.length > 1) {
                    newExercises.splice(exerciseIndex, 1);
                    setEditingWorkout({ ...editingWorkout, exercises: newExercises });
                }
            };

            const moveExercise = (fromIndex, toIndex) => {
                if (toIndex < 0 || toIndex >= editingWorkout.exercises.length) return;
                const newExercises = [...editingWorkout.exercises];
                const [moved] = newExercises.splice(fromIndex, 1);
                newExercises.splice(toIndex, 0, moved);
                setEditingWorkout({ ...editingWorkout, exercises: newExercises });
            };

            const saveWorkout = () => {
                if (editingWorkout.name && editingWorkout.exercises.every(ex => ex.name)) {
                    const prev = workouts[editingDay];
                    // Preserve an in-progress session across edits (adding notes / tweaking
                    // settings used to silently cancel the workout). Only drop progress if the
                    // edit made the saved indices invalid.
                    let progress = prev && prev.progress ? prev.progress : null;
                    if (progress) {
                        const ex = editingWorkout.exercises[progress.currentExerciseIndex];
                        if (!ex || !ex.sets[progress.currentSetIndex]) progress = null;
                    }
                    const newWorkouts = { ...workouts };
                    newWorkouts[editingDay] = { ...editingWorkout, progress };
                    setWorkouts(newWorkouts);
                    setView('landing');
                    setEditingDay(null);
                    setEditingWorkout(null);
                }
            };

            // Active-session marker: lets us drop the user straight back into a live
            // workout when the PWA is reopened (instead of forcing a Continue tap), and
            // makes set-1 recoverable.
            const writeSessionMarker = (day) => {
                try { localStorage.setItem('cwa-active-session', JSON.stringify({ user: currentUser ? currentUser.username : null, day, ts: Date.now() })); } catch (err) {}
            };
            const clearSessionMarker = () => {
                try { localStorage.removeItem('cwa-active-session'); } catch (err) {}
            };

            // On app reopen, jump straight back into a recent in-progress workout.
            const resumeSessionIfAny = (loadedWorkouts, username) => {
                try {
                    const raw = localStorage.getItem('cwa-active-session');
                    if (!raw) return false;
                    const marker = JSON.parse(raw);
                    if (!marker || !marker.day) return false;
                    if (marker.user && username && marker.user !== username) return false;
                    // Only auto-resume sessions within the auto-end window so we never yank the
                    // user into a workout they abandoned (matches sanitizeWorkouts, which has
                    // already stripped progress older than this from loadedWorkouts).
                    if (Date.now() - (marker.ts || 0) > AUTO_END_MS) return false;
                    const w = loadedWorkouts[marker.day];
                    if (!w || !w.progress) return false;
                    const p = w.progress;
                    // Indices may be stale if the workout was edited — validate before resuming.
                    if (!w.exercises[p.currentExerciseIndex] || !w.exercises[p.currentExerciseIndex].sets[p.currentSetIndex]) return false;
                    setCurrentExerciseIndex(p.currentExerciseIndex);
                    setCurrentSetIndex(p.currentSetIndex);
                    setWorkoutStartTime(p.startTime || Date.now());
                    setCompletedSets(p.completedSets || []);
                    setSetStartTime(Date.now());
                    setInitialWorkoutSnapshot(p.initialSnapshot || JSON.parse(JSON.stringify({ ...w, progress: null })));
                    setLiveWorkout({ ...w, day: marker.day });
                    setActiveTab('workout');
                    setView('live');
                    return true;
                } catch (err) { return false; }
            };

            const startWorkout = (day) => {
                const workout = workouts[day];
                const progress = workout.progress;
                if (progress) {
                    setCurrentExerciseIndex(progress.currentExerciseIndex);
                    setCurrentSetIndex(progress.currentSetIndex);
                    setWorkoutStartTime(progress.startTime);
                    setCompletedSets(progress.completedSets || []);
                    setSetStartTime(progress.setStartTime || Date.now());
                    if (progress.initialSnapshot) setInitialWorkoutSnapshot(progress.initialSnapshot);
                    else setInitialWorkoutSnapshot(JSON.parse(JSON.stringify(workout)));
                } else {
                    // Brand-new session: persist progress immediately (including the initial
                    // snapshot) so the workout is recoverable even if the app is killed while
                    // still on the very first set.
                    const snapshot = JSON.parse(JSON.stringify({ ...workout, progress: null }));
                    const now = Date.now();
                    setInitialWorkoutSnapshot(snapshot);
                    setCurrentExerciseIndex(0);
                    setCurrentSetIndex(0);
                    setWorkoutStartTime(now);
                    setCompletedSets([]);
                    setSetStartTime(now);
                    setWorkouts(prev => ({
                        ...prev,
                        [day]: { ...prev[day], progress: { currentExerciseIndex: 0, currentSetIndex: 0, startTime: now, setStartTime: now, completedSets: [], initialSnapshot: snapshot } }
                    }));
                }
                writeSessionMarker(day);
                setLiveWorkout({ ...workout, day });
                setView('live');
                setActiveTab('workout');
            };

            const getTotalSetsRemaining = () => {
                if (!liveWorkout) return 0;
                let total = 0;
                for (let i = currentExerciseIndex; i < liveWorkout.exercises.length; i++) {
                    const exercise = liveWorkout.exercises[i];
                    total += i === currentExerciseIndex ? exercise.sets.length - currentSetIndex : exercise.sets.length;
                }
                return total;
            };

            const updateLiveSet = (field, value) => {
                const newWorkout = { ...liveWorkout };
                newWorkout.exercises[currentExerciseIndex].sets[currentSetIndex][field] = parseFloat(value) || 0;
                setLiveWorkout(newWorkout);
            };

            const nextSet = () => {
                const setTime = currentSetTime;
                const newCompletedSets = [...completedSets, setTime];
                setCompletedSets(newCompletedSets);

                const updatedWorkouts = { ...workouts };
                updatedWorkouts[liveWorkout.day] = {
                    ...liveWorkout,
                    progress: { currentExerciseIndex, currentSetIndex: currentSetIndex + 1, startTime: workoutStartTime, setStartTime: Date.now(), completedSets: newCompletedSets, initialSnapshot: initialWorkoutSnapshot }
                };

                const currentExercise = liveWorkout.exercises[currentExerciseIndex];

                if (currentSetIndex + 1 < currentExercise.sets.length) {
                    setCurrentSetIndex(currentSetIndex + 1);
                    setSetStartTime(Date.now());
                    setCurrentSetTime(0);
                    updatedWorkouts[liveWorkout.day].progress.currentSetIndex = currentSetIndex + 1;
                    updatedWorkouts[liveWorkout.day].progress.setStartTime = Date.now();
                } else if (currentExerciseIndex + 1 < liveWorkout.exercises.length) {
                    setCurrentExerciseIndex(currentExerciseIndex + 1);
                    setCurrentSetIndex(0);
                    setSetStartTime(Date.now());
                    setCurrentSetTime(0);
                    updatedWorkouts[liveWorkout.day].progress.currentExerciseIndex = currentExerciseIndex + 1;
                    updatedWorkouts[liveWorkout.day].progress.currentSetIndex = 0;
                    updatedWorkouts[liveWorkout.day].progress.setStartTime = Date.now();
                } else {
                    updatedWorkouts[liveWorkout.day].progress = null;
                    setWorkouts(updatedWorkouts);
                    const { totalScore, maxScore } = calculateWorkoutSummary();
                    saveToHistory(liveWorkout, Math.floor((Date.now() - workoutStartTime) / 1000), totalScore, maxScore);
                    clearSessionMarker();
                    setView('complete');
                    return;
                }
                writeSessionMarker(liveWorkout.day);
                setWorkouts(updatedWorkouts);
            };

            const prevSet = () => {
                if (currentSetIndex > 0) {
                    setCurrentSetIndex(currentSetIndex - 1);
                    setSetStartTime(Date.now());
                    setCurrentSetTime(0);
                    // Remove last completed set time
                    if (completedSets.length > 0) {
                        setCompletedSets(completedSets.slice(0, -1));
                    }
                } else if (currentExerciseIndex > 0) {
                    const prevExercise = liveWorkout.exercises[currentExerciseIndex - 1];
                    setCurrentExerciseIndex(currentExerciseIndex - 1);
                    setCurrentSetIndex(prevExercise.sets.length - 1);
                    setSetStartTime(Date.now());
                    setCurrentSetTime(0);
                    if (completedSets.length > 0) {
                        setCompletedSets(completedSets.slice(0, -1));
                    }
                }
                // else: already at very first set, do nothing
            };

            const canGoPrev = () => {
                return currentSetIndex > 0 || currentExerciseIndex > 0;
            };

            // The watch's ⏭ / ⏮ (fresh closures every render; js/watch.js calls through the ref).
            watchRef.current = {
                next: () => {
                    if (view !== 'live' || !liveWorkout) return;
                    const ex = liveWorkout.exercises[currentExerciseIndex];
                    const finishing = currentSetIndex >= ex.sets.length - 1 && currentExerciseIndex >= liveWorkout.exercises.length - 1;
                    nextSet();
                    if (!finishing && window.CWAWatch) window.CWAWatch.startRest();
                },
                prev: () => {
                    if (view !== 'live') return;
                    if (canGoPrev()) prevSet();
                    if (window.CWAWatch) window.CWAWatch.stopRest();
                },
            };

            const getNextExerciseName = () => {
                if (!liveWorkout) return '';
                const currentExercise = liveWorkout.exercises[currentExerciseIndex];
                const isLastSetOfExercise = currentSetIndex >= currentExercise.sets.length - 1;
                const isLastExercise = currentExerciseIndex >= liveWorkout.exercises.length - 1;
                if (isLastSetOfExercise && isLastExercise) return 'Finish';
                if (isLastSetOfExercise && !isLastExercise) return liveWorkout.exercises[currentExerciseIndex + 1].name;
                return null; // still more sets in current exercise
            };

            const finishWorkout = () => {
                clearSessionMarker();
                setView('landing');
                setActiveTab('calendar');
                setLiveWorkout(null);
                setCurrentExerciseIndex(0);
                setCurrentSetIndex(0);
                setWorkoutStartTime(null);
                setSetStartTime(null);
                setTotalElapsedTime(0);
                setCurrentSetTime(0);
                setCompletedSets([]);
                setInitialWorkoutSnapshot(null);
            };

            // Permanently delete a day's workout from the plan.
            const deleteWorkout = (day) => {
                setWorkouts(prev => {
                    const nw = { ...prev };
                    delete nw[day];
                    return nw;
                });
                if (liveWorkout && liveWorkout.day === day) {
                    clearSessionMarker();
                    setLiveWorkout(null);
                }
                setView('landing');
                setActiveTab('calendar');
                setEditingDay(null);
                setEditingWorkout(null);
            };

            // Discard an in-progress workout without saving to history (clears its progress).
            const cancelWorkout = () => {
                if (liveWorkout) {
                    setWorkouts(prev => {
                        const nw = { ...prev };
                        if (nw[liveWorkout.day]) nw[liveWorkout.day] = { ...nw[liveWorkout.day], progress: null };
                        return nw;
                    });
                }
                clearSessionMarker();
                setLiveWorkout(null);
                setCurrentExerciseIndex(0);
                setCurrentSetIndex(0);
                setWorkoutStartTime(null);
                setSetStartTime(null);
                setTotalElapsedTime(0);
                setCurrentSetTime(0);
                setCompletedSets([]);
                setInitialWorkoutSnapshot(null);
                setView('landing');
                setActiveTab('calendar');
            };

            const calculateWorkoutSummary = () => {
                if (!initialWorkoutSnapshot || !liveWorkout) return { summary: [], totalScore: 0, maxScore: 0 };
                const summary = [];
                let totalScore = 0;
                liveWorkout.exercises.forEach((exercise, exIdx) => {
                    const initialExercise = initialWorkoutSnapshot.exercises[exIdx];
                    if (!initialExercise) return;
                    let totalRepsIncrease = 0, maxWeightIncrease = 0, hasChanges = false, points = 0;
                    exercise.sets.forEach((set, setIdx) => {
                        const initialSet = initialExercise.sets[setIdx];
                        if (!initialSet) return;
                        const repsDiff = set.reps - initialSet.reps;
                        const weightDiff = set.weight - initialSet.weight;
                        if (repsDiff > 0) { totalRepsIncrease += repsDiff; hasChanges = true; }
                        if (weightDiff > maxWeightIncrease) { maxWeightIncrease = weightDiff; if (weightDiff > 0) hasChanges = true; }
                    });
                    // Round to kill floating-point dust (e.g. 0.1+0.1+0.1 = 0.30000000004).
                    totalRepsIncrease = Math.round(totalRepsIncrease * 100) / 100;
                    maxWeightIncrease = Math.round(maxWeightIncrease * 100) / 100;
                    if (maxWeightIncrease > 0) points = 2;
                    else if (totalRepsIncrease >= 2) points = 2;
                    else if (totalRepsIncrease >= 1) points = 1;
                    totalScore += points;
                    let changeText = 'No change';
                    if (totalRepsIncrease > 0 && maxWeightIncrease > 0) changeText = `Increased reps by ${fmtNum(totalRepsIncrease)} and weight by ${fmtNum(maxWeightIncrease)}kg`;
                    else if (totalRepsIncrease > 0) changeText = `Increased reps by ${fmtNum(totalRepsIncrease)}`;
                    else if (maxWeightIncrease > 0) changeText = `Increased weight by ${fmtNum(maxWeightIncrease)}kg`;
                    summary.push({ name: exercise.name, change: changeText, hasChanges, points });
                });
                return { summary, totalScore, maxScore: liveWorkout.exercises.length * 2 };
            };

            // ======================
            // PROGRESS-TRACKING HANDLERS
            // ======================
            const updateProfileField = (field, value) => setProfile(prev => ({ ...prev, [field]: value }));

            // One metrics entry per calendar day. opts.edit (the day sheet, prefilled with the day's
            // entry) replaces it; the Daily Log's quick form fills in only the fields it was given.
            // A weight equal to the scale's stays the scale's (its time and body composition); a
            // weight cleared in an edit keeps that day's weigh-ins out, like deleting the day.
            const SCALE_FIELDS = ['scaleT', 'src', 'imp', 'bodyFat', 'muscleKg', 'waterPct', 'boneKg'];
            const saveMetric = (entry, opts) => {
                const k = dayKey(entry.date);
                const old = metrics.find(m => dayKey(m.date) === k);
                const edit = !!(opts && opts.edit);
                let next;
                if (edit || !old) next = { ...entry };
                else {
                    next = { ...old, date: entry.date };
                    Object.keys(entry).forEach(f => { if (entry[f] != null && entry[f] !== '') next[f] = entry[f]; });
                }
                if (old && old.scaleT) {
                    if (next.weight === old.weight) SCALE_FIELDS.forEach(f => { if (old[f] != null) next[f] = old[f]; });
                    else SCALE_FIELDS.forEach(f => { delete next[f]; });
                }
                if (edit && next.weight == null && old && old.weight != null && window.CWAHealth) {
                    const w = window.CWAHealth.weighInsByDay(healthLog, scaleSkips)[k];
                    if (w) setScaleSkips(prev => window.CWAHealth.addSkip(prev, k, w.t, Date.now()));
                }
                setMetrics(prev => [...prev.filter(m => dayKey(m.date) !== k), next].sort((a, b) => a.date - b.date));
            };
            // Deleting a day also keeps its scale weigh-ins (so far) from being merged back in; a
            // later weigh-in that day still comes in.
            const deleteMetric = (date) => {
                const k = dayKey(date);
                const entry = metrics.find(m => dayKey(m.date) === k);
                const w = window.CWAHealth ? window.CWAHealth.weighInsByDay(healthLog)[k] : null;
                const t = Math.max((entry && entry.scaleT) || 0, (w && w.t) || 0);
                if (t) setScaleSkips(prev => window.CWAHealth.addSkip(prev, k, t, Date.now()));
                setMetrics(prev => prev.filter(m => dayKey(m.date) !== k));
            };

            const addPhotoFromFile = async (file, dateTs) => {
                if (!file || !currentUser) return;
                try {
                    const ts = dateTs || Date.now();
                    const data = await compressImage(file);
                    const rec = { id: `${currentUser.username}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`, user: currentUser.username, date: ts, week: weekKey(ts), data };
                    await photoAdd(rec);
                    await refreshPhotos();
                    setToast('Photo added');
                } catch (err) { setAiError('Could not add photo: ' + (err.message || err)); }
            };
            const removePhoto = async (id) => { try { await photoDelete(id); await refreshPhotos(); } catch (err) {} };

            // All timestamped data points used to judge how much history exists.
            const allDataDates = () => [
                ...workoutHistory.map(w => w.date),
                ...metrics.map(m => m.date),
                ...photos.map(p => p.date),
            ].filter(Boolean);

            const distinctWeeks = () => countDistinct(allDataDates(), weekKey);
            const distinctMonths = () => countDistinct(allDataDates(), monthKey);

            // Exercises with "proper history": appear in >=2 logged sessions. Used so the LLM
            // only reasons about lifts the user has actually stuck with.
            // Opens the CWA Health app (Android) with this account's sign-in, so it can upload in the background.
            const linkAndroidApp = () => {
                const H = window.CWAHealth;
                if (!H || !currentUser) return;
                const a = fbAuthEnabled() ? fbInit() : null;
                const fbUser = a && a.currentUser;
                if (fbAuthEnabled() && currentUser.email && !(fbUser && fbUser.refreshToken)) { setToast('Sign in again, then link.'); return; }
                const latestW = metrics.filter(m => m.weight != null).sort((x, y) => y.date - x.date)[0];
                if (!H.isAndroid()) setToast('Open CWA on your Android phone to link the app.');
                window.location.href = H.linkUrl({ dbUrl: FIREBASE_DB_URL, uid: currentUser.username, apiKey: FIREBASE_API_KEY, refreshToken: fbUser ? fbUser.refreshToken : '', email: currentUser.email || '', weight: latestW ? latestW.weight : '' });
            };

            const aiUsedToday = () => (aiUsage.date === dayKey(Date.now()) ? aiUsage.count : 0);

            const sendChat = async (text) => {
                if (!proxyEnabled()) { setAiError('AI coach is not configured yet.'); return; }
                const today = dayKey(Date.now());
                const used = aiUsedToday();
                if (used >= DAILY_AI_LIMIT) { setAiError(`Daily limit reached (${DAILY_AI_LIMIT} messages/day). Resets tomorrow.`); return; }
                const cur = chats.find(c => c.id === chatId);
                const id = cur ? cur.id : 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
                const next = [...(cur ? cur.messages : []), { role: 'user', content: text, ts: Date.now() }];
                // Put the conversation (new or updated) first; only the newest COACH_MAX_CHATS stay.
                const upsert = (list, messages) => {
                    const prev = list.find(c => c.id === id);
                    const conv = { id, title: prev ? prev.title : chatTitle(text), created: prev ? prev.created : Date.now(), updated: Date.now(), messages: messages.slice(-COACH_MAX_MESSAGES) };
                    return [conv, ...list.filter(c => c.id !== id)].slice(0, COACH_MAX_CHATS);
                };
                setChats(list => upsert(list, next));
                setChatId(id);
                setAiBusy(true); setAiError('');
                try {
                    const C = window.CWACoach;
                    // The topic of the last few questions decides which data gets the detailed version.
                    const focus = C.focusFrom(next.filter(m => m.role === 'user').slice(-3).map(m => m.content));
                    const context = C.buildContext({ now: Date.now(), profile, workouts, history: workoutHistory, metrics, foodLog, memory: coachMemory, N: window.CWANutrition, focus, health: healthLog, H: window.CWAHealth });
                    const system = C.SYSTEM + "\n\n--- The user's data (analysed by the app) ---\n" + context;
                    // Recent turns only; older answers are shortened (the memory carries what lasts).
                    const turns = next.slice(-COACH_CONTEXT_MESSAGES).map((m, i, arr) => ({ role: m.role, content: m.role === 'assistant' && i < arr.length - 2 && m.content.length > 1500 ? m.content.slice(0, 1500) + ' […]' : m.content }));
                    const reply = await callAIProxy({ system, messages: turns, user: currentUser ? currentUser.username : '', maxTokens: 1200 }, true);
                    const { text: replyText, memories } = C.extractMemories(reply.text);
                    const answer = { role: 'assistant', content: replyText || reply.text, ts: Date.now() };
                    if (reply.model) answer.model = reply.model.split('/').pop();
                    if (reply.fallback) answer.fallback = true; // the preferred model didn't answer
                    if (memories.length) { answer.remembered = memories; setCoachMemory(list => C.mergeMemories(list, memories, Date.now())); }
                    setChats(list => { const c = list.find(x => x.id === id); return upsert(list, [...(c ? c.messages : next), answer]); });
                    setAiUsage({ date: today, count: used + 1 }); // count only successful replies
                } catch (err) {
                    setAiError(err.message || 'Message failed');
                } finally { setAiBusy(false); }
            };

            const deleteChat = (conv) => setConfirmState({
                title: 'Delete conversation?',
                message: `"${conv.title}" will be deleted.`,
                confirmLabel: 'Delete',
                onConfirm: () => { setChats(list => list.filter(c => c.id !== conv.id)); if (chatId === conv.id) setChatId(null); setConfirmState(null); }
            });

            // --- Full backup export / import (JSON). Also the migration path between
            // accounts / auth methods, since photos live on-device. ---
            const exportData = async () => {
                try {
                    const ph = currentUser ? await photoList(currentUser.username) : [];
                    const blob = { app: 'CWA', version: APP_VERSION, exportedAt: Date.now(), profile, metrics, recaps, workouts, history: workoutHistory, foodLog, foods, photos: ph };
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(new Blob([JSON.stringify(blob)], { type: 'application/json' }));
                    a.download = `cwa-backup-${new Date().toISOString().slice(0, 10)}.json`;
                    document.body.appendChild(a); a.click(); a.remove();
                    setToast('Backup downloaded');
                } catch (err) { setAiError('Export failed: ' + (err.message || err)); }
            };
            const importData = (file) => {
                const reader = new FileReader();
                reader.onload = () => {
                    let blob;
                    try { blob = JSON.parse(reader.result); } catch (err) { setAiError('Invalid backup file'); return; }
                    setConfirmState({
                        title: 'Import backup?',
                        message: 'This replaces your current workouts, history, goals, metrics, food diary, custom foods and photos with the backup.',
                        confirmLabel: 'Import', danger: false,
                        onConfirm: async () => {
                            if (blob.workouts) setWorkouts(sanitizeWorkouts(blob.workouts));
                            if (Array.isArray(blob.history)) setWorkoutHistory(blob.history);
                            if (blob.profile) setProfile({ ...DEFAULT_PROFILE, ...blob.profile });
                            if (Array.isArray(blob.metrics)) setMetrics(blob.metrics);
                            if (Array.isArray(blob.recaps)) setRecaps(blob.recaps);
                            if (blob.foods && typeof blob.foods === 'object') setFoods(blob.foods);
                            if (blob.foodLog && typeof blob.foodLog === 'object' && currentUser) {
                                const uname = currentUser.username;
                                writeLocalFoodLog(uname, blob.foodLog);
                                setFoodLog(blob.foodLog);
                                const days = Object.keys(blob.foodLog);
                                days.forEach(d => unsyncedMark(uname, 'foodLog/' + d, false));
                                if (cloudEnabled() && await cloudSet('users/' + uname + '/foodLog', blob.foodLog)) days.forEach(d => unsyncedMark(uname, 'foodLog/' + d, true));
                            }
                            if (Array.isArray(blob.photos) && currentUser) {
                                for (const p of blob.photos) {
                                    try { await photoAdd({ ...p, user: currentUser.username, id: p.id || `${currentUser.username}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}` }); } catch (err) {}
                                }
                                await refreshPhotos();
                            }
                            setConfirmState(null);
                            setToast('Backup imported');
                        }
                    });
                };
                reader.readAsText(file);
            };

            // This week's plan status, from the history (an entry's `day` is the plan slot it was
            // for, so Monday's workout done on Tuesday counts for Monday).
            // status: progress | done | missed (earlier this week, not done) | today | upcoming | rest
            // next: the workout Start should open — an unfinished session first, then the
            // earliest missed day, then today, then the next planned day.
            const weekStatus = () => {
                const now = new Date();
                const todayIdx = (now.getDay() + 6) % 7;
                const monday = new Date(now); monday.setHours(0, 0, 0, 0); monday.setDate(monday.getDate() - todayIdx);
                const done = new Set(workoutHistory.filter(h => h.date >= monday.getTime() && h.day).map(h => h.day));
                const status = {};
                DAYS.forEach((d, i) => {
                    const w = workouts[d];
                    status[d] = !w ? 'rest' : w.progress ? 'progress' : done.has(d) ? 'done' : i < todayIdx ? 'missed' : i === todayIdx ? 'today' : 'upcoming';
                });
                const planned = DAYS.filter(d => workouts[d]);
                const pick = (st) => planned.find(d => status[d] === st);
                return {
                    status,
                    planned: planned.length,
                    done: planned.filter(d => status[d] === 'done').length,
                    missed: planned.filter(d => status[d] === 'missed'),
                    next: pick('progress') || pick('missed') || pick('today') || pick('upcoming') || null,
                };
            };

            // Display name shown in the app (falls back to email/username).
            const accountName = () => (profile.displayName && profile.displayName.trim()) || (currentUser && (currentUser.email || currentUser.username)) || 'Athlete';
            // Open the unified profile/progress hub (reached from the person icon — there is
            // no longer a bottom-nav tab for it, to save space on cover screens).
            const openHub = () => { setProgressSub('hub'); setAiError(''); setActiveTab(''); setView('progress'); };
            const personBtn = e('button', {
                onClick: openHub,
                'aria-label': 'Profile',
                className: 'w-9 h-9 rounded-xl flex items-center justify-center transition-all active:scale-90',
                style: { background: 'rgba(209, 252, 0, 0.1)' }
            }, e(MIcon, { icon: 'person', fill: true, style: { fontSize: '20px', color: 'var(--primary-container)' } }));
            // On the cover screen the bottom bar drops Food; its button sits here instead.
            const profileBtn = isCoverScreen ? e('div', { className: 'flex items-center gap-2' },
                e('button', {
                    onClick: () => handleTabChange('food'),
                    'aria-label': 'Food',
                    className: 'w-9 h-9 rounded-xl flex items-center justify-center transition-all active:scale-90',
                    style: view === 'food' ? { background: 'var(--primary-container)', color: 'var(--on-primary-container)' } : { background: 'rgba(209, 252, 0, 0.1)', color: 'var(--primary-container)' }
                }, e(MIcon, { icon: 'restaurant', fill: view === 'food', style: { fontSize: '20px' } })),
                personBtn
            ) : personBtn;

            // ======================
            // LOADING
            // ======================
            if (isLoading) {
                return e('div', {
                    className: 'min-h-screen flex items-center justify-center',
                    style: { background: 'var(--void)', color: 'var(--on-surface)' }
                }, e('div', { className: 'text-xl font-bold', style: { color: 'var(--primary-container)' } }, 'Loading...'));
            }

            // ======================
            // LOGIN VIEW
            // ======================
            if (view === 'login') {
                return e('div', {
                    className: 'h-full flex flex-col items-center justify-center px-6',
                    style: { background: 'var(--void)', color: 'var(--on-surface)', overflow: 'hidden' }
                },
